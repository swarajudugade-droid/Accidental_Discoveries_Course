{
 id:9, tag:"Chapter 8", title:"The Lilac That Lowered Blood Sugar: Metformin", mins:30,
 sub:"A weed, a forgotten synthesis and a drug found three times, with a mechanism still argued over.",
 obj:[
  "Trace the long timeline from goat's rue to Glucophage",
  "Explain metformin's physicochemical properties and transporter-dependent pharmacokinetics",
  "Interpret the lipophilicity–potency–toxicity trade-off in biguanides",
  "Summarise proposed mechanisms, adverse effects and the 2019–20 NDMA episode"
 ],
 body:`
<h3>The serendipitous event</h3>
<ul>
 <li><b>Goat's rue (<i>Galega officinalis</i>)</b>, French lilac, was a noxious weed toxic to sheep but a herbal remedy for many complaints, including excessive thirst and urination.</li>
 <li><b>1914:</b> Tanret isolated <b>galegine</b>. <b>1918:</b> Watanabe showed <b>guanidine</b> lowered glucose in rabbits (too toxic). <b>1920s:</b> <b>Synthalin</b> was used then withdrawn (liver/kidney damage) as insulin took over.</li>
 <li><b>1922:</b> <b>Werner and Bell</b> (Trinity College Dublin) first made dimethylbiguanide (metformin). <b>1929:</b> <b>Slotta and Tschesche</b> saw it lower glucose in rabbits; ignored.</li>
 <li><b>1949:</b> <b>Eusebio García</b> (Manila) tested it for <b>influenza</b> (Flumamine), noticed lowered blood sugar. <b>1957:</b> <b>Jean Sterne</b> (Paris) reported reliable glucose lowering and named it <b>Glucophage</b> ("glucose eater"); launched in France in 1958.</li>
 <li>Phenformin and buformin (late 1950s) were more potent; phenformin's <b>lactic acidosis</b> led to withdrawal from the US in <b>1977</b>, tarring metformin, which was approved in the US only in <b>1994</b>.</li>
 <li><b>1998 UKPDS</b> showed fewer heart attacks and lower mortality in overweight patients on metformin; <b>2002 DPP</b> showed reduced progression to diabetes. It is on the WHO essential medicines list.</li>
</ul>
<div class="callout myth"><b>Myth and Record</b> Goat's rue was used for a range of complaints; calling it a "diabetes remedy" is an interpretation. And no single person discovered metformin: separate steps in Ireland, Germany, the Philippines and France over 35 years.</div>
<h3>The chemist's bench</h3>
<p><b>Guanidine</b> is among the strongest organic bases because the protonated form delocalises charge over three nitrogens. <b>Metformin</b> is a biguanide (two linked guanidines) with two methyl groups. <b>Phenformin</b> carries a phenylethyl group.</p>
<ul>
 <li><b>pKa &gt; 12</b>: fully ionised at body pH, almost no passive diffusion, no protein binding, <b>no metabolism</b>. It needs <b>organic cation transporters</b> (OCT1 into gut wall and liver; OCT2 for renal elimination), is excreted unchanged, ≈50% absorbed, t½ ≈ 6 h. Reduced kidney function raises concentration.</li>
 <li><b>Potency vs safety:</b> lipophilic groups enter mitochondria more easily and inhibit respiration more strongly → more potent but greater <b>lactic acidosis</b> risk. The safest member (metformin, weak) was not the most potent.</li>
</ul>
<table>
 <tr><th>Compound</th><th>Substituent</th><th>Comment</th></tr>
 <tr><td>Guanidine</td><td>None</td><td>Lowers glucose but too toxic</td></tr>
 <tr><td>Galegine</td><td>Prenyl</td><td>Natural; short-acting, toxic</td></tr>
 <tr><td>Metformin</td><td>Two methyls</td><td>Least lipophilic; wide safety margin</td></tr>
 <tr><td>Buformin</td><td>Butyl</td><td>More lipophilic; withdrawn in most markets</td></tr>
 <tr><td>Phenformin</td><td>Phenylethyl</td><td>More potent; withdrawn 1977 (lactic acidosis)</td></tr>
</table>
<p>Manufacture is a single step: dimethylamine hydrochloride + dicyandiamide, which explains the price.</p>
<div class="callout analyst"><b>Analyst's corner</b> Assay by non-aqueous titration with perchloric acid in glacial acetic acid, or UV near <b>233 nm</b>. Chromatography is difficult because metformin is so polar and basic (ion-pairing, HILIC or mixed-mode columns). In <b>2019–2020</b> <b>NDMA</b> (N-nitrosodimethylamine, probable carcinogen) was found above limits in some batches; the acceptable daily intake is <b>96 ng</b>, requiring LC-MS/MS or GC-MS/MS, risk assessment of all ingredients and steps, and tightened raw-material controls.</div>
<h3>The pharmacologist's lab</h3>
<ul>
 <li>Mainly lowers glucose by <b>reducing hepatic gluconeogenesis</b>; also improves insulin sensitivity and muscle uptake. It <b>does not stimulate insulin secretion</b>, so it is an <b>antihyperglycaemic</b>, not hypoglycaemic, drug; weight neutral or slightly reduced.</li>
 <li><b>Mechanism (still debated):</b> mild inhibition of <b>mitochondrial complex I</b> (Owen, Doran, Halestrap, 2000) → ↓ ATP, ↑ AMP:ATP → <b>AMPK</b> activation (Zhou et al., 2001) → ↓ gluconeogenesis and lipid synthesis. Other proposals: mitochondrial glycerophosphate dehydrogenase (Madiraju, 2014); a lysosomal <b>PEN2–v-ATPase</b> route to AMPK (Ma, 2022); gut actions (microbiome, GLP-1, GDF15).</li>
 <li>Adverse effects: GI symptoms (start low, take with food, extended release), metallic taste, <b>vitamin B<sub>12</sub></b> deficiency over time. <b>Lactic acidosis</b> is very rare but is why it is avoided in severe renal impairment, acute heart failure, severe infection or dehydration; it may be held before intravenous contrast.</li>
 <li>Off-label: PCOS; studied for prevention of diabetes, cancer and ageing (speculative). India: &gt;100 million people with diabetes (2023 survey).</li>
</ul>
<h3>Legacy</h3>
<p>Traditional plant medicine can point to real biology (quinine, reserpine, artemisinin, metformin). The 1929 observation could have been used 30 years earlier; old journals are a source of ideas. Phenformin's failure nearly took metformin down with it: examine each member of a class on its own evidence. A drug can be excellent without a settled mechanism because trial evidence, not mechanism, establishes benefit.</p>`,
 key:[
  "Goat's rue → galegine/guanidine (toxic) → metformin made 1922, seen active 1929, tested in influenza 1949, introduced for diabetes by Sterne in 1957.",
  "Biguanide with pKa > 12: ionised, unmetabolised, needs OCT transporters, cleared by the kidney.",
  "More lipophilic biguanides (phenformin, buformin) are more potent but more prone to lactic acidosis.",
  "Lowers hepatic gluconeogenesis without stimulating insulin; evidence supports complex I inhibition and AMPK activation; mechanism still debated.",
  "GI effects and B12 deficiency are common; lactic acidosis is rare. NDMA contamination (2019–20) illustrates impurity control."
 ],
 check:[
  {q:"Which plant gave the first clue that led to metformin?", o:["Galega officinalis (goat’s rue)","Rauwolfia serpentina","Catharanthus roseus","Claviceps purpurea"], w:"Galegine and guanidine from goat's rue pointed toward the biguanides."},
  {q:"Why is metformin poorly membrane-permeable?", o:["It is a very strong base (pKa > 12), fully ionised at body pH","It is highly lipophilic","It is rapidly metabolised in the gut wall","It binds plasma proteins avidly"], w:"It therefore relies on organic cation transporters such as OCT1 and OCT2."},
  {q:"Why was phenformin withdrawn from the US market in 1977?", o:["Lactic acidosis","Hepatotoxicity","NDMA contamination","Hypertensive crisis"], w:"Its greater lipophilicity and potency raised the risk of lactic acidosis."},
  {q:"Metformin is called an antihyperglycaemic rather than a hypoglycaemic drug because it…", o:["lowers elevated glucose without stimulating insulin secretion","raises insulin secretion","has no effect on glucose","only acts after meals"], w:"It seldom causes hypoglycaemia on its own."},
  {q:"What acceptable daily intake was set for NDMA in the 2019–2020 metformin episode?", o:["96 nanograms","96 milligrams","9.6 micrograms","96 grams"], w:"At gram-level daily doses this implies a parts-per-billion limit, requiring mass spectrometry."}
 ]
},
{
 id:10, tag:"Chapters 9–11", title:"Beyond the Eight: Ten More Accidents, the Road to Approval, and Engineering Luck", mins:40,
 sub:"A gallery of shorter stories, what must happen after the accident, and how to keep a mind prepared.",
 obj:[
  "Summarise ten further serendipitous drug stories and classify the types of accident",
  "Describe the stages from observation to licensed medicine and the four trial phases",
  "Explain how disasters shaped regulation, and name the Indian regulatory framework",
  "List the habits of the prepared mind and the limits of 'luck' as a strategy"
 ],
 body:`
<h3>Ten more happy accidents</h3>
<table>
 <tr><th>Medicine</th><th>Year</th><th>What was sought</th><th>What was found</th></tr>
 <tr><td>Cisplatin</td><td>1965</td><td>Effect of an electric field on bacteria</td><td>Platinum from electrodes stopped cell division</td></tr>
 <tr><td>Chlordiazepoxide</td><td>1957</td><td>Dyes/sedatives (abandoned)</td><td>Forgotten crystalline compound was strongly calming</td></tr>
 <tr><td>Lithium</td><td>1949</td><td>Toxin in manic patients' urine</td><td>Lithium salts calmed guinea pigs</td></tr>
 <tr><td>Imipramine</td><td>1955–57</td><td>An antipsychotic</td><td>Lifted depression</td></tr>
 <tr><td>Chlorpromazine</td><td>1950–52</td><td>Antihistamine / anaesthetic adjunct</td><td>Calm, indifferent patients; psychosis eased</td></tr>
 <tr><td>Minoxidil</td><td>1960s–88</td><td>Ulcer drug, then antihypertensive</td><td>Hair growth</td></tr>
 <tr><td>Tamoxifen</td><td>1962</td><td>Morning-after contraceptive</td><td>Leading breast cancer hormone therapy</td></tr>
 <tr><td>Vinblastine / vincristine</td><td>1950s</td><td>Plant remedy for diabetes</td><td>Low white counts; anticancer activity</td></tr>
 <tr><td>Botulinum toxin</td><td>1970s–87</td><td>Treatment for squint</td><td>Smoothed frown lines; many uses</td></tr>
 <tr><td>Finasteride</td><td>1974–92</td><td>Natural experiment in a Dominican village</td><td>Drug for BPH and hair loss</td></tr>
</table>
<ul>
 <li><b>Cisplatin:</b> <b>Barnett Rosenberg</b> (Michigan State) saw bacteria grow into long filaments; the active agent was <i>cis</i>-diamminedichloroplatinum(II), formed from the platinum electrodes (the <i>trans</i> isomer is inactive). Approved 1978; testicular cancer cure rate rose above 9 in 10. It binds guanine N7, forming intrastrand cross-links. Kidney toxicity was managed with hydration.</li>
 <li><b>Chlordiazepoxide (Librium):</b> <b>Leo Sternbach</b> (Roche). <b>Earl Reeder</b> found an untested compound that had sat on a shelf for about two years. A rearrangement had unexpectedly given a seven-membered <b>benzodiazepine</b>. Launched 1960; diazepam 1963. Acts on <b>GABA-A</b>; tolerance and dependence limit long-term use.</li>
 <li><b>Lithium:</b> <b>John Cade</b> (Melbourne) used lithium urate because lithium salts are most soluble; the guinea pigs became placid. He tested lithium citrate on himself and ten manic patients. <b>Mogens Schou</b> established safe blood levels; approved in the US 1970; narrow therapeutic range.</li>
 <li><b>Imipramine:</b> <b>Roland Kuhn</b> tested G22355, close to chlorpromazine, hoping for an antipsychotic; some depressed patients brightened (1957). It blocks noradrenaline and serotonin <b>reuptake</b> (Axelrod).</li>
 <li><b>Chlorpromazine:</b> <b>Charpentier</b> (Rhône-Poulenc, 1950) → <b>Laborit</b> saw calm detachment → <b>Delay and Deniker</b> (Sainte-Anne, 1952). Blocks <b>D2 receptors</b>; began the antipsychotic era.</li>
 <li><b>Minoxidil:</b> Upjohn; opens K<sup>+</sup> channels in vascular smooth muscle; hair growth led to topical use (approved 1988).</li>
 <li><b>Tamoxifen:</b> ICI (Richardson, Walpole) failed as a contraceptive (induced ovulation); <b>Craig Jordan</b> showed it blocks oestrogen-dependent tumours. Approved in Britain 1973; the first <b>SERM</b>: antagonist in breast, partial agonist in bone and uterus.</li>
 <li><b>Vinca alkaloids:</b> <b>Noble and Beer</b> tested <i>Catharanthus roseus</i> for glucose lowering, found none, but saw white-cell depletion; vinblastine and vincristine bind <b>tubulin</b>, blocking the mitotic spindle (Hodgkin's disease; childhood ALL).</li>
 <li><b>Botulinum toxin:</b> <b>Alan Scott</b> used tiny doses for strabismus (approved 1989); the <b>Carruthers</b> noticed smoother frown lines. Cleaves <b>SNAP-25</b>, blocking acetylcholine release.</li>
 <li><b>Finasteride:</b> <b>Imperato-McGinley</b> studied the <i>guevedoces</i>, who lack <b>steroid 5α-reductase type 2</b> (testosterone → DHT); small prostates and no baldness. Merck's inhibitor: BPH (1992), hair loss (1997).</li>
</ul>
<h3>After the accident: from observation to medicine</h3>
<p>An observation is a <b>hypothesis</b>. Between it and the pharmacy shelf lies the "valley of death" (penicillin sat there for ten years: a chemistry problem, a clinical problem, an engineering problem).</p>
<table>
 <tr><th>Stage</th><th>Purpose</th></tr>
 <tr><td>Confirm &amp; characterise</td><td>Repeat under control; isolate and identify the active substance; rule out contaminants</td></tr>
 <tr><td>Pharmacology &amp; toxicology</td><td>Effects, dose, duration; acute/repeat-dose toxicity in two species; genotoxicity, reproduction, heart/CNS safety; test solvents too</td></tr>
 <tr><td>CMC (chemistry, manufacturing, controls)</td><td>Reproducible synthesis, specifications, validated methods, stability, impurity limits, packaging</td></tr>
 <tr><td>Phase I</td><td>Small number of (usually healthy) volunteers: safety, absorption, clearance</td></tr>
 <tr><td>Phase II</td><td>A few hundred patients: activity and dose</td></tr>
 <tr><td>Phase III</td><td>Large randomised trials vs placebo/standard care: do patients live longer or feel better?</td></tr>
 <tr><td>Phase IV / pharmacovigilance</td><td>Post-approval surveillance for rare or late effects (e.g., phenformin)</td></tr>
</table>
<p>Roughly <b>nine in ten</b> candidates entering human trials never reach the market.</p>
<h3>How the rules were written</h3>
<ul>
 <li><b>1937/1938:</b> Elixir Sulfanilamide → US law requiring proof of safety.</li>
 <li><b>Thalidomide</b> → <b>1962</b> amendments requiring proof of efficacy.</li>
 <li><b>Nuremberg Code (1947)</b>: voluntary, informed participation; <b>Declaration of Helsinki (1964)</b> extended it.</li>
 <li><b>Russell and Burch (1959):</b> the <b>three Rs</b>: replace, reduce, refine.</li>
 <li><b>India:</b> Drugs and Cosmetics Act 1940; <b>CDSCO</b> oversees approvals; <b>New Drugs and Clinical Trials Rules 2019</b>; <b>Indian Pharmacopoeia Commission</b> sets standards and since 2010 coordinates the <b>Pharmacovigilance Programme of India (PvPI)</b>.</li>
 <li>Quality guidelines: stability, impurities (ICH Q3), analytical validation and lifecycle, and mutagenic impurities (M7), relevant to the nitrosamine problem.</li>
</ul>
<h3>Engineering luck</h3>
<table>
 <tr><th>Type of accident</th><th>Examples</th></tr>
 <tr><td>Contamination or chance exposure</td><td>Penicillin, cisplatin, LSD</td></tr>
 <tr><td>Side effect noticed in trials</td><td>Sildenafil, iproniazid, minoxidil</td></tr>
 <tr><td>Failed purpose</td><td>Imipramine, tamoxifen, chlordiazepoxide</td></tr>
 <tr><td>Animal / test-system surprise</td><td>Prontosil, lithium, vinca alkaloids</td></tr>
 <tr><td>Natural experiment or old observation</td><td>Finasteride, warfarin, metformin</td></tr>
</table>
<p><b>Habits of the prepared mind:</b> (1) <b>attention</b> to what is not part of the plan; (2) testing in the <b>right system</b>; (3) <b>follow-up</b> (Florey and Chain, Link's six years); (4) <b>scepticism</b> with control experiments; (5) an <b>environment that allows diversion</b> (Pfizer, Roche).</p>
<ul>
 <li><b>Phenotypic screening</b>: a 2011 analysis of drugs approved 1999–2008 found it produced more first-in-class small-molecule medicines than target-based screening.</li>
 <li><b>Repositioning</b>: dexamethasone reduced deaths in severe COVID-19 needing oxygen/ventilation (2020 UK trial); thalidomide repurposed for leprosy complications and multiple myeloma under strict controls.</li>
 <li><b>Caution:</b> medicine is not just luck. Statins, HIV protease inhibitors, imatinib and monoclonal antibodies came from targeted rational research, and each discovery had human, animal and ethical costs.</li>
</ul>
<div class="callout tip"><b>For the student</b> You cannot arrange to have an accident, but you can prepare: learn the fundamentals deeply, keep a notebook of things that do not fit, use controls, read outside your field, talk to clinicians and herbalists, and look at a strange result twice before throwing it away.</div>`,
 key:[
  "Ten shorter stories: cisplatin, chlordiazepoxide, lithium, imipramine, chlorpromazine, minoxidil, tamoxifen, vinca alkaloids, botulinum toxin, finasteride.",
  "An observation is a hypothesis: characterise, test pharmacology/toxicology, build CMC, then Phases I–III and Phase IV surveillance. ~90% of candidates entering human trials fail.",
  "Regulation grew from disasters: Elixir Sulfanilamide (1938), thalidomide (1962); Nuremberg, Helsinki, the three Rs; in India D&C Act, NDCT Rules 2019 and PvPI.",
  "Five types of accident and five habits of the prepared mind: attention, right test system, follow-up, scepticism, permissive environment.",
  "Chance favours the prepared mind, and the patient, sceptical people who keep going after the accident."
 ],
 check:[

  {q:"John Cade discovered lithium’s calming effect while testing urine from manic patients in…", o:["guinea pigs","rabbits","mice with lymphoma","dogs"], w:"He used lithium urate for solubility, then realised the lithium caused the placid behaviour."},

 {m:1, q:"Which professional lens asks, “What does the drug bind to, and what happens in the cell, organ and patient after it does?”", o:["The pharmacologist’s lens (mechanism of action and ADME)","The medicinal chemist’s lens (structure–activity relationships)","The regulator’s lens","The analyst’s lens only"], w:"The chemist asks about structure and SAR; the pharmacologist asks about action: mechanism, absorption, distribution, metabolism and excretion."},

 {m:2, q:"Why was the isolation of 6-aminopenicillanic acid (6-APA) a breakthrough?", o:["It is the penicillin core without a side chain, so new acyl groups could be attached to make semisynthetic penicillins","It was the first total synthesis of penicillin","It showed penicillin was a sulfonamide","It inhibits β-lactamases"], w:"6-APA, made at Beecham in 1957–59, made systematic redesign possible (methicillin, ampicillin and others)."},
 {m:2, q:"Methicillin-resistant Staphylococcus aureus (MRSA) is resistant mainly because it…", o:["carries an altered penicillin-binding protein, PBP2a, to which β-lactams bind poorly","makes a PABA-rich cell wall","lacks peptidoglycan","activates the drug to an inactive metabolite"], w:"Altered PBPs are the second resistance mechanism, alongside β-lactamases and reduced entry or increased export."},
 {m:2, q:"What improved penicillin yields dramatically at Peoria in the 1940s?", o:["Corn steep liquor, lactose and a high-yielding Penicillium strain from a mouldy cantaloupe, with deep-tank fermentation","Chemical total synthesis by Sheehan","Using bedpans as larger vessels","Growing Fleming’s original strain on glucose"], w:"Peoria’s fermentation science, not new chemistry, delivered penicillin in quantity."},

 {m:3, q:"Which statement best explains why sulfanilamide competitively inhibits bacterial folate synthesis?", o:["It resembles PABA, since the sulfonamide is a bioisostere of PABA’s carboxylate, so DHPS mistakes it for its substrate","It irreversibly acylates DHFR","It cleaves the azo bond of folate","It alkylates bacterial DNA"], w:"A para-amino group opposite an acidic group gives the same shape, size and charge as PABA."},
 {m:3, q:"Why is co-trimoxazole (sulfamethoxazole + trimethoprim) more effective than either drug alone?", o:["It blocks two sequential steps of the same folate pathway (DHPS and DHFR)","Trimethoprim is a prodrug of sulfamethoxazole","Both inhibit DHPS at different sites","Trimethoprim prevents acetylation of the sulfonamide"], w:"Sequential blockade is synergistic and can turn bacteriostatic action into bactericidal action."},
 {m:3, q:"Sulfasalazine delivers 5-aminosalicylic acid to the colon because…", o:["colonic bacteria reduce its azo bond","stomach acid hydrolyses its amide bond","hepatic CYP2C9 cleaves it","it is a β-lactam"], w:"The azo-prodrug idea, first seen in Prontosil, became a deliberate delivery system."},

 {m:4, q:"Which structural feature of sildenafil mimics the natural substrate of PDE5?", o:["The pyrazolopyrimidinone ring, a guanine mimic of cGMP","The sulfonamide linker alone","The N-methylpiperazine","The ethyl ester"], w:"The bicyclic core imitates guanine of cGMP and hydrogen-bonds to a conserved glutamine in the active site."},
 {m:4, q:"Tadalafil differs from sildenafil in that it…", o:["has a half-life of about 17 hours and cross-reacts with PDE11, linked to muscle aches","is more selective for PDE6","has a half-life of about 1 hour","is a nitrate"], w:"Tadalafil has a carboline structure, lasts much longer, and its PDE11 activity is thought to cause back pain and aches."},

 {m:5, q:"Which liver enzyme mainly clears the more potent S-enantiomer of warfarin?", o:["CYP2C9","CYP3A4","CYP1A2","CYP2D6"], w:"CYP2C9 variants slow clearance and lower dose requirement; R-warfarin is cleared by several other CYPs."},
 {m:5, q:"Why is heparin often given with the first doses of warfarin?", o:["Protein C falls before clotting factors do, creating a brief prothrombotic period","Warfarin has no effect for the first month","Heparin activates VKORC1","Warfarin raises factor VII early"], w:"Protein C has a short half-life (about 8 h); early imbalance can even cause skin necrosis."},

 {m:6, q:"In what sense is LSD a “conformationally restricted serotonin”?", o:["Its ergoline ring locks the tryptamine skeleton of serotonin into a rigid structure","It is a prodrug of serotonin","It is a serotonin reuptake inhibitor","It is a polymer of serotonin"], w:"Tracing the indole and two-carbon chain to the amine shows serotonin’s skeleton fixed in a ring."},
 {m:6, q:"What did Gaddum’s experiments on isolated smooth muscle suggest about the brain?", o:["LSD blocked serotonin’s effect, implying serotonin may be involved in mental function","LSD is a dopamine agonist","Serotonin is absent from the brain","LSD inhibits MAO"], w:"Together with Twarog and Page’s detection of brain serotonin, this launched serotonin neurochemistry."},
 {m:6, q:"Why must a stability-indicating method for ergot alkaloids separate the C-8 epimers?", o:["Otherwise the inactive iso-compound formed on degradation would inflate the apparent active content","The epimers have different colours","Epimers cannot be detected by fluorescence","Only the iso form is volatile"], w:"Epimerisation occurs under basic conditions or light; a method blind to it overstates potency."},

 {m:7, q:"Why was iproniazid withdrawn from most markets in 1961?", o:["Severe liver injury (hepatotoxicity)","Tyramine reactions only","It was ineffective against depression","It caused birth defects"], w:"Hydrazine oxidation generates reactive species that damage liver cells; later MAOIs were designed with this in mind."},
 {m:7, q:"Why is a gap of about two weeks needed after stopping an irreversible MAO inhibitor before starting an interacting drug?", o:["The enzyme is permanently disabled and recovery requires synthesis of new enzyme","The drug has a two-week half-life in plasma","Tyramine stores take two weeks to refill","The liver needs two weeks to acetylate it"], w:"Irreversible inhibition means function returns only as new MAO is made."},

 {m:8, q:"Why can Bari (December 1943) NOT be called the origin of nitrogen mustard therapy?", o:["The Yale work, including the first treated patient, took place in 1942, a year earlier","Bari involved a different gas","Nobody was exposed to mustard at Bari","The Bari data were never used"], w:"Bari added human evidence of blood and marrow effects, but the idea and first treatment came earlier."},
 {m:8, q:"What is the chief DNA lesion produced by bifunctional nitrogen mustards, and at which atom?", o:["Interstrand cross-links, mainly at guanine N7","Strand breaks at thymine O4","Intercalation between base pairs","Adenine deamination"], w:"The aziridinium ion alkylates N7 of guanine; the second arm reaches the opposite strand."},
 {m:8, q:"Why are marrow, gut lining and hair follicles damaged by alkylating agents?", o:["They contain rapidly dividing cells that cannot repair cross-links before the next division","They lack DNA repair enzymes entirely","They express MAO","They are the only tissues that take up the drug"], w:"Therapeutic effect and toxicity are two sides of one mechanism."},

 {m:9, q:"Who introduced metformin for diabetes (as Glucophage), building on a report of its use in influenza?", o:["Jean Sterne, Paris, 1957","Georges Tanret, 1914","Emil Werner and James Bell, 1922","Eusebio García, 1949"], w:"García noticed lowered glucose in Manila (1949); Sterne tested and launched it for diabetes."},
 {m:9, q:"Which proposed mechanism has the most support for metformin’s liver action?", o:["Mild inhibition of mitochondrial complex I raises AMP:ATP and activates AMPK, reducing gluconeogenesis","Stimulation of pancreatic insulin release","Blockade of sodium–glucose cotransporters","Inhibition of dipeptidyl peptidase-4 only"], w:"Other routes (mGPD, a lysosomal PEN2 route, gut effects) are also proposed, so the mechanism is still debated."},

 {m:10, q:"Tamoxifen is called a selective oestrogen receptor modulator (SERM) because it…", o:["blocks oestrogen in breast tissue but partly mimics it in bone and uterus","blocks oestrogen in every tissue equally","is an aromatase inhibitor","is a progesterone agonist"], w:"It began as a failed contraceptive and became a leading breast cancer therapy."},
 {m:10, q:"What is the main purpose of Phase II clinical trials?", o:["To look for activity in a few hundred patients with the target condition and to find a dose","To assess pharmacokinetics in healthy volunteers","To compare against standard therapy in thousands of patients","To monitor rare adverse effects after approval"], w:"Phase I = safety/PK; Phase III = large randomised comparison; Phase IV = post-marketing surveillance."},
 {m:10, q:"Which body coordinates the Pharmacovigilance Programme of India (PvPI)?", o:["The Indian Pharmacopoeia Commission (since 2010)","The Pharmacy Council of India only","The World Health Organization","The Central Bureau of Narcotics"], w:"PvPI collects adverse drug reaction reports from hospitals and clinics: the way the next unexpected effect is noticed."}
];

/* ---------- storage (safe) ---------- */
var DKEY=KEY;
function load(){try{var r=localStorage.getItem(DKEY);return r?JSON.parse(r):{};}catch(e){return {};}}
var S={};
function norm(){S.done=S.done||{};S.checks=S.checks||{};S.name=S.name||"";S.college=S.college||"";S.best=S.best||null;}
S=load();norm();
var memFallback=false;
function save(){try{localStorage.setItem(DKEY,JSON.stringify(S));}catch(e){memFallback=true;} pushRemote();}

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function doneCount(){return MODS.filter(function(m){return S.done[m.id];}).length;}
function allDone(){return doneCount()===MODS.length;}
function passed(){return !!(S.best&&S.best.passed);}

/* cache of shuffled option orders for module checks (stable while page is open) */
var orderCache={};
function orderFor(mid,qi,n){var k=mid+"-"+qi;if(!orderCache[k]){var idx=[];for(var i=0;i<n;i++)idx.push(i);orderCache[k]=shuffle(idx);}return orderCache[k];}

/* ---------- Supabase auth + sync ---------- */
var AUTH_CONFIGURED=!!(SUPABASE_URL&&SUPABASE_ANON_KEY);
var AUTH_ON=AUTH_CONFIGURED&&!!(window.supabase&&window.supabase.createClient);
var authEmail="",authName="",sb=null,user=null,authMode="in",authMsg=null,recovery=false,loadingUser=AUTH_ON,pushT=null,syncState="";
if(AUTH_ON){try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});}catch(e){AUTH_ON=false;}}
function setSync(t){syncState=t;var e=$("#syncLbl");if(e)e.textContent=t;}
function pushRemote(){
  if(!AUTH_ON||!user)return;
  clearTimeout(pushT);
  pushT=setTimeout(function(){
    sb.from("course_progress").upsert({user_id:user.id,data:S,updated_at:new Date().toISOString()})
      .then(function(r){setSync(r.error?"Not synced":"Synced");},function(){setSync("Not synced");});
  },700);
}
function logAttempt(res){
  if(!AUTH_ON||!user)return;
  sb.from("exam_attempts").insert({user_id:user.id,score:res.score,total:N_EXAM,percent:res.pct,passed:res.passed}).then(function(){},function(){});
}
function startUser(u){
  user=u;DKEY=KEY+"-"+u.id;
  return sb.from("course_progress").select("data").eq("user_id",u.id).maybeSingle().then(function(r){
    if(r&&r.data&&r.data.data&&typeof r.data.data==="object"){S=r.data.data;}else{S=load();}
    norm();
    if(!S.name&&u.user_metadata&&u.user_metadata.full_name)S.name=u.user_metadata.full_name;
    setSync(r&&r.error?"Not synced":"Synced");
    save();
  },function(){S=load();norm();setSync("Not synced");});
}
function updateTop(){
  var b=$("#userBox");if(!b)return;
  if(AUTH_ON&&user&&!recovery){b.innerHTML='<span class="em" title="'+esc(user.email||"")+'">'+esc(user.email||"")+'</span><span id="syncLbl">'+esc(syncState)+'</span><button class="iconbtn" data-signout="1">Sign out</button>';}
  else b.innerHTML="";
}
function viewAuth(el){
  if(AUTH_CONFIGURED&&!AUTH_ON){el.innerHTML='<div class="card authcard"><h1>Sign-in unavailable</h1><p>The sign-in service could not be loaded. Check your internet connection and reload this page.</p></div>';return;}
  if(loadingUser){el.innerHTML='<div class="card authcard"><h1>Loading…</h1><p>Opening your course.</p></div>';return;}
  var m=authMsg?'<div class="amsg '+authMsg.t+'" role="alert">'+esc(authMsg.m)+'</div>':'';
  var h='<div class="card authcard"><div class="eyebrow">Accidental Discoveries · The Course</div>';
  if(recovery){
    h+='<h1>Set a new password</h1>'+m+'<form class="authform" data-mode="newpw"><label for="a_pw">New password</label><input id="a_pw" name="password" type="password" minlength="6" required autocomplete="new-password"><button class="btn" type="submit">Update password</button></form>';
  }else if(authMode==="forgot"){
    h+='<h1>Reset password</h1>'+m+'<form class="authform" data-mode="forgot"><label for="a_em">Email</label><input id="a_em" name="email" type="email" required autocomplete="email" value="'+esc(authEmail)+'"><button class="btn" type="submit">Send reset link</button></form><p style="text-align:center"><button class="linkbtn" data-authmode="in">Back to sign in</button></p>';
  }else{
    var up=authMode==="up";
    h+='<h1>'+(up?'Create your account':'Sign in to start')+'</h1><div class="authtabs" role="tablist"><button class="chip" data-authmode="in" aria-pressed="'+(!up)+'">Sign in</button><button class="chip" data-authmode="up" aria-pressed="'+up+'">Create account</button></div>'+m+
    '<form class="authform" data-mode="'+(up?'up':'in')+'">'+(up?'<label for="a_fn">Full name</label><input id="a_fn" name="fullname" type="text" required autocomplete="name" value="'+esc(authName)+'">':'')+
    '<label for="a_em">Email</label><input id="a_em" name="email" type="email" required autocomplete="email" value="'+esc(authEmail)+'"><label for="a_pw">Password</label><input id="a_pw" name="password" type="password" minlength="6" required autocomplete="'+(up?'new-password':'current-password')+'"><button class="btn" type="submit">'+(up?'Create account':'Sign in')+'</button></form>'+
    (up?'':'<p style="text-align:center"><button class="linkbtn" data-authmode="forgot">Forgot password?</button></p>');
  }
  el.innerHTML=h+'</div>';
}
if(AUTH_ON){
  setTimeout(function(){if(loadingUser&&!user){loadingUser=false;render();}},6000);
  sb.auth.onAuthStateChange(function(ev,session){
    if(ev==="PASSWORD_RECOVERY"){recovery=true;setTimeout(render,0);return;}
    if(ev==="SIGNED_OUT"){user=null;DKEY=KEY;S={};norm();loadingUser=false;recovery=false;E=null;setTimeout(render,0);return;}
    if(session&&session.user&&(ev==="SIGNED_IN"||ev==="INITIAL_SESSION")){
      if(user&&user.id===session.user.id)return;
      loadingUser=true;
      setTimeout(function(){startUser(session.user).then(function(){loadingUser=false;render();});},0);
    }else if(ev==="INITIAL_SESSION"){loadingUser=false;setTimeout(render,0);}
  });
}

/* ---------- navigation ---------- */
function route(){var h=location.hash.replace("#","")||"home";return h;}
function go(r){if(location.hash==="#"+r){render();}else{location.hash=r;}}

function renderNav(cur){
  var h='<h4>Start</h4>'+item("home","★","Course overview",cur,false,false);
  h+='<h4>Modules</h4>';
  MODS.forEach(function(m){h+=item("m"+m.id,m.id,m.title,cur,S.done[m.id],false);});
  h+='<h4>Assessment</h4>';
  h+=item("exam","✎","Final exam ("+N_EXAM+" questions)",cur,passed(),!allDone());
  h+=item("cert","✔","Certificate",cur,false,!passed());
  $("#side").innerHTML=h;
}
function item(r,sym,label,cur,done,locked){
  return '<button class="navitem'+(done?' done':'')+(locked?' locked':'')+'" data-r="'+r+'"'+(cur===r?' aria-current="page"':'')+'><span class="dot">'+(done?'✓':sym)+'</span><span>'+esc(label)+(locked?' 🔒':'')+'</span></button>';
}
function updateProgress(){
  var n=doneCount(),p=Math.round(n/MODS.length*100);
  $("#progLbl").textContent=n+" / "+MODS.length+" modules";
  var b=$("#progBar");b.setAttribute("aria-valuenow",p);b.firstElementChild.style.width=p+"%";
}

/* ---------- views ---------- */
function render(){
  var r=route(),page=$("#page");
  if((AUTH_CONFIGURED&&!AUTH_ON)||(AUTH_ON&&(!user||recovery))){
    document.body.classList.add("authing");$("#side").innerHTML="";viewAuth(page);updateTop();return;
  }
  document.body.classList.remove("authing");
  var m=/^m(\d+)$/.exec(r);
  if(m){var mod=MODS.filter(function(x){return x.id===+m[1];})[0];if(mod){viewModule(mod,page);}else{viewHome(page);r="home";}}
  else if(r==="exam"){viewExam(page);}
  else if(r==="cert"){viewCert(page);}
  else {viewHome(page);r="home";}
  renderNav(r);updateProgress();updateTop();
  $("#side").classList.remove("open");$("#menuBtn").setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
  document.title=(m?"Module "+m[1]+" · ":r==="exam"?"Final exam · ":"")+"Accidental Discoveries: The Course";
}

  h+='</div>';
  h+='<div class="card" style="margin-top:24px"><div class="actions" style="margin:0"><div><b>Final exam</b><br><span style="color:var(--muted);font-size:.9rem">'+(allDone()?'Unlocked. Good luck!':'Unlocks after you complete all '+MODS.length+' modules ('+doneCount()+' done).')+'</span></div><div class="grp"><button class="btn ghost" data-reset="1">Reset progress</button><button class="btn" data-go="exam"'+(allDone()?'':' disabled')+'>Go to exam</button></div></div></div>';
  h+=foot();
  el.innerHTML=h;
}
function foot(){return '<footer class="foot">© 2026 Dr. Babaso Vitthal Udugade and Mrs. Swati Babaso Udugade. Course adapted from <i>Accidental Discoveries</i>. For education and general interest; not medical advice.'+(memFallback?' (Browser storage unavailable: progress will not persist.)':'')+'</footer>';}

function viewModule(mod,el){
  var idx=MODS.indexOf(mod),prev=MODS[idx-1],next=MODS[idx+1];
  var ans=S.checks[mod.id]||{};
  var h='<div class="eyebrow">'+esc(mod.tag)+' · Module '+mod.id+' of '+MODS.length+' · ≈ '+mod.mins+' min</div><h1>'+esc(mod.title)+'</h1><p class="sub">'+esc(mod.sub)+'</p>';
  h+='<div class="card objectives"><h2>What you will learn</h2><ul>'+mod.obj.map(function(o){return '<li>'+esc(o)+'</li>';}).join("")+'</ul></div>';
  h+='<div class="content">'+mod.body+'</div>';
  h+='<div class="keypoints"><h2>Key points</h2><ul>'+mod.key.map(function(k){return '<li>'+esc(k)+'</li>';}).join("")+'</ul></div>';
  h+='<section aria-labelledby="chk"><h2 id="chk">Check your understanding <span class="score" id="chkScore"></span></h2><p style="color:var(--muted);font-size:.92rem;margin-top:-.3em">Practice only: these do not count toward the final exam.</p>';
  mod.check.forEach(function(q,qi){h+=questionHTML(mod,q,qi,ans[qi]);});
  h+='<div style="text-align:right"><button class="btn ghost" data-resetchk="'+mod.id+'" style="padding:6px 12px;font-size:.85rem">Retry this check</button></div></section>';
  h+='<div class="actions"><div class="grp">'+(prev?'<button class="btn ghost" data-go="m'+prev.id+'">← Module '+prev.id+'</button>':'<button class="btn ghost" data-go="home">← Overview</button>')+'</div><div class="grp">'+
     '<button class="btn" id="doneBtn" data-done="'+mod.id+'">'+(S.done[mod.id]?'✓ Completed (click to undo)':'Mark module complete')+'</button>'+
     (next?'<button class="btn ghost" data-go="m'+next.id+'">Module '+next.id+' →</button>':'<button class="btn ghost" data-go="exam">Final exam →</button>')+'</div></div>';
  h+=foot();
  el.innerHTML=h;
  scoreChk(mod);
}
function questionHTML(mod,q,qi,chosen){
  var order=orderFor(mod.id,qi,q.o.length),answered=(chosen!==undefined);
  var h='<fieldset class="q" data-qi="'+qi+'" style="min-width:0"><legend>Q'+(qi+1)+'. '+esc(q.q)+'</legend><div class="opts">';
  order.forEach(function(orig,pos){
    var cls="opt";
    if(answered){if(orig===0)cls+=" correct";else if(orig===chosen)cls+=" wrong";}
    h+='<button type="button" class="'+cls+'" data-mod="'+mod.id+'" data-q="'+qi+'" data-orig="'+orig+'"'+(answered?' disabled':'')+'><span class="l">'+LET[pos]+'</span><span>'+esc(q.o[orig])+'</span>'+
       (answered&&orig===0?'<span class="tag ok">Correct</span>':(answered&&orig===chosen?'<span class="tag no">Your answer</span>':''))+'</button>';
  });
  h+='</div>';
  if(answered)h+='<div class="why '+(chosen===0?'ok':'no')+'"><b>'+(chosen===0?'Correct. ':'Not quite. ')+'</b>'+esc(q.w)+'</div>';
  return h+'</fieldset>';
}
function scoreChk(mod){
  var a=S.checks[mod.id]||{},n=0,t=0;
  mod.check.forEach(function(q,i){if(a[i]!==undefined){t++;if(a[i]===0)n++;}});
  var el=$("#chkScore");if(el)el.textContent=t?"("+n+"/"+mod.check.length+" correct"+(t<mod.check.length?", "+t+" answered":"")+")":"";
}

/* ---------- exam ---------- */
var E=null; // current attempt
function newAttempt(){
  E={submitted:false,filter:"all",qs:shuffle(EXAM.map(function(q,i){return i;})).map(function(i){
    var q=EXAM[i];return {src:i,m:q.m,q:q.q,w:q.w,opts:shuffle(q.o.map(function(t,k){return {t:t,orig:k};})),pick:null};
  })};
}
function modName(id){var m=MODS.filter(function(x){return x.id===id;})[0];return m?m.title.split(":")[0]:"";}

function viewExam(el){
  if(!allDone()){
    el.innerHTML='<div class="card lock"><div class="big">🔒</div><h1>Final exam locked</h1><p>Complete all '+MODS.length+' modules to unlock the exam. You have completed <b>'+doneCount()+'</b>.</p><button class="btn" data-go="home">Back to overview</button></div>'+foot();
    return;
  }
  if(!E){ // intro
    var b=S.best;
    el.innerHTML='<div class="eyebrow">Final assessment</div><h1>Final exam</h1><p class="sub">Covers all '+MODS.length+' modules.</p>'+
    '<div class="rules"><div><b>'+N_EXAM+'</b><span>questions</span></div><div><b>'+PASS_PCT+'%</b><span>passing score</span></div><div><b>'+PASS_MARK+'</b><span>correct answers needed</span></div><div><b>∞</b><span>retakes</span></div></div>'+
    '<div class="card"><ul><li>Each question has one correct answer.</li><li>You can change answers until you submit.</li><li>After submitting you will see your score, a module-by-module breakdown, and every question with the <b>correct answer highlighted</b> and an explanation.</li><li>Order of questions and options changes on every attempt.</li></ul></div>'+
    (b?'<div class="card">Your best score so far: <b>'+b.score+' / '+N_EXAM+' ('+b.pct+'%)</b> · '+(b.passed?'<span style="color:var(--ok);font-weight:700">PASSED</span>':'<span style="color:var(--bad);font-weight:700">not yet passed</span>')+'</div>':'')+
    '<button class="btn" data-startexam="1">'+(b?'Start a new attempt':'Start exam')+'</button>'+foot();
    return;
  }
  if(E.submitted){viewResult(el);return;}
  var h='<div class="eyebrow">Final exam</div><h1>Answer all '+N_EXAM+' questions</h1>'+
  '<div class="sticky-prog"><span id="exAns">0 / '+N_EXAM+' answered</span><span>Pass: '+PASS_MARK+' correct ('+PASS_PCT+'%)</span></div>';
  E.qs.forEach(function(q,i){
    h+='<fieldset class="q" style="min-width:0" data-ei="'+i+'"><legend><span class="qmeta" style="display:block">Question '+(i+1)+' of '+N_EXAM+'</span>'+esc(q.q)+'</legend><div class="opts">'+
    q.opts.map(function(o,pos){return '<button type="button" class="opt'+(q.pick===o.orig?' sel':'')+'" data-ei="'+i+'" data-orig="'+o.orig+'" aria-pressed="'+(q.pick===o.orig)+'"><span class="l">'+LET[pos]+'</span><span>'+esc(o.t)+'</span></button>';}).join("")+'</div></fieldset>';
  });
  h+='<div class="actions"><button class="btn ghost" data-go="home">Leave exam</button><button class="btn" data-submit="1">Submit exam</button></div>'+foot();
  el.innerHTML=h;updateExamCount();
}
function updateExamCount(){var n=E.qs.filter(function(q){return q.pick!==null;}).length;var el=$("#exAns");if(el)el.textContent=n+" / "+N_EXAM+" answered";}

function grade(){
  var score=0,perMod={};
  E.qs.forEach(function(q){
    var ok=(q.pick===0);if(ok)score++;
    var p=perMod[q.m]||(perMod[q.m]={c:0,t:0});p.t++;if(ok)p.c++;
  });
  var pct=Math.round(score/N_EXAM*100);
  E.result={score:score,pct:pct,passed:score>=PASS_MARK,perMod:perMod};
  if(!S.best||score>S.best.score||(score===S.best.score&&E.result.passed&&!S.best.passed)){
    S.best={score:score,pct:pct,passed:E.result.passed,date:new Date().toISOString()};
  } else if(E.result.passed&&!S.best.passed){S.best.passed=true;}
  if(E.result.passed&&!S.best.passed){S.best.passed=true;}
  save();
  logAttempt(E.result);
}
function viewResult(el){
  var r=E.result,unans=E.qs.filter(function(q){return q.pick===null;}).length;
  var h='<div class="eyebrow">Exam result</div><div class="result '+(r.passed?'pass':'fail')+'" role="status"><div class="big">'+r.score+' / '+N_EXAM+'</div><div style="font-size:1.3rem;margin-top:4px">'+r.pct+'%</div><div class="verdict">'+(r.passed?'PASSED 🎉':'NOT PASSED')+'</div>'+
  '<p style="margin:10px 0 0">'+(r.passed?'You met the '+PASS_PCT+'% passing criterion ('+PASS_MARK+' correct needed).':'The passing criterion is '+PASS_PCT+'% ('+PASS_MARK+' of '+N_EXAM+' correct). You were '+(PASS_MARK-r.score)+' question'+(PASS_MARK-r.score===1?'':'s')+' short. Review the answers below and try again.')+(unans?' ('+unans+' left unanswered.)':'')+'</p></div>';
  h+='<div class="actions" style="margin-top:16px"><div class="grp">'+(r.passed?'<button class="btn" data-go="cert">Get certificate</button>':'')+'<button class="btn '+(r.passed?'ghost':'')+'" data-startexam="1">Retake exam</button></div><button class="btn ghost" data-go="home">Overview</button></div>';
  h+='<h2>Score by module</h2><div class="mbreak">';
  MODS.forEach(function(m){var p=r.perMod[m.id]||{c:0,t:0};if(!p.t)return;h+='<div class="mrow"><span class="nm" title="'+esc(m.title)+'">'+m.id+'. '+esc(m.title.split(":")[0])+'</span><span class="tr"><i style="width:'+Math.round(p.c/p.t*100)+'%"></i></span><span>'+p.c+'/'+p.t+'</span></div>';});
  h+='</div><h2>Review: correct answers and explanations</h2><div class="filters noprint" role="group" aria-label="Filter review">'+
  ['all','wrong','right'].map(function(f){return '<button class="chip" data-filter="'+f+'" aria-pressed="'+(E.filter===f)+'">'+({all:'All questions',wrong:'Incorrect / unanswered',right:'Correct'})[f]+'</button>';}).join("")+'</div>';
  E.qs.forEach(function(q,i){
    var ok=q.pick===0,st=q.pick===null?"unanswered":(ok?"right":"wrong");
    if(E.filter==="wrong"&&ok)return; if(E.filter==="right"&&!ok)return;
    h+='<fieldset class="q" style="min-width:0"><legend><span class="qmeta" style="display:block">Question '+(i+1)+' · Module '+q.m+' · <b style="color:'+(ok?'var(--ok)':'var(--bad)')+'">'+(ok?'Correct':(q.pick===null?'Not answered':'Incorrect'))+'</b></span>'+esc(q.q)+'</legend><div class="opts">'+
    q.opts.map(function(o,pos){
      var cls="opt",tag="";
      if(o.orig===0){cls+=" correct";tag='<span class="tag ok">Correct answer</span>';}
      else if(q.pick===o.orig){cls+=" wrong";tag='<span class="tag no">Your answer</span>';}
      if(o.orig===0&&q.pick===0)tag='<span class="tag ok">Your answer ✓</span>';
      return '<div class="'+cls+'"><span class="l">'+LET[pos]+'</span><span>'+esc(o.t)+'</span>'+tag+'</div>';
    }).join("")+'</div><div class="why '+(ok?'ok':'no')+'"><b>Why: </b>'+esc(q.w)+' <a href="#m'+q.m+'" style="white-space:nowrap">Revisit module '+q.m+' →</a></div></fieldset>';
  });
  h+=foot();el.innerHTML=h;
}

/* ---------- certificate ---------- */
function clgHTML(c){return 'of <b>'+esc(c||'Name of College')+'</b>';}
function viewCert(el){
  if(!passed()){el.innerHTML='<div class="card lock"><div class="big">🔒</div><h1>Certificate locked</h1><p>Pass the final exam ('+PASS_PCT+'% or more) to unlock your certificate.</p><button class="btn" data-go="exam">Go to exam</button></div>'+foot();return;}
  var d=S.best.date?new Date(S.best.date):new Date();
  var ds=d.toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
  var seal='<svg class="seal" viewBox="0 0 100 130" aria-hidden="true"><path d="M30 78 L18 125 L38 114 L50 128 L55 84Z" fill="#f2b51d"/><path d="M70 78 L82 125 L62 114 L50 128 L45 84Z" fill="#e6a010"/><g fill="#f2b51d">'+(function(){var o="";for(var i=0;i<16;i++){o+='<circle cx="'+(50+37*Math.cos(i*Math.PI/8)).toFixed(1)+'" cy="'+(50+37*Math.sin(i*Math.PI/8)).toFixed(1)+'" r="9"/>';}return o;})()+'</g><circle cx="50" cy="50" r="38" fill="#f7c73a"/><circle cx="50" cy="50" r="30" fill="#fbd95e" stroke="#e6a010" stroke-width="2"/><path d="M50 30l5.6 11.4 12.6 1.8-9.1 8.9 2.1 12.5L50 58.5l-11.2 5.9 2.1-12.5-9.1-8.9 12.6-1.8z" fill="#f2b51d" stroke="#e09a0c" stroke-width="1.2"/></svg>';
  el.innerHTML='<div class="eyebrow noprint">Congratulations</div><h1 class="noprint">Your certificate</h1>'+
  '<div class="card noprint"><label for="nm"><b>Enter your name</b> as it should appear:</label><br><input class="namefield" id="nm" type="text" maxlength="60" value="'+esc(S.name)+'" placeholder="Your full name" autocomplete="name">'+
  '<div style="height:12px"></div><label for="clg"><b>Name of college / institution</b>:</label><br><input class="namefield" id="clg" type="text" maxlength="90" value="'+esc(S.college||"")+'" placeholder="e.g., Adarsh College of Pharmacy, Vita" autocomplete="organization"></div>'+
  '<div class="certwrap" id="certArea"><div class="cert">'+
   '<div class="tri tl1"></div><div class="tri tl2"></div><div class="tri br1"></div><div class="tri br2"></div><div class="frame"></div>'+
   '<div class="in">'+
    '<img class="logo" src="'+LOGO+'" alt="Maharashtra Academy of Skills and Knowledge logo">'+
    '<div class="t1">CERTIFICATE</div><div class="t2">OF COMPLETION</div>'+
    '<div class="course">Accidental Discoveries<small>The Serendipitous Blunders and Lucky Accidents That Gave Us Life-Saving Medicines</small></div>'+
    '<div class="aw">THIS CERTIFIES THAT</div>'+
    '<div class="nm" id="certName">'+esc(S.name||"Your Name")+'</div>'+
    '<div class="clg" id="certClg">'+clgHTML(S.college)+'</div>'+
    '<div class="body">has completed all '+MODS.length+' modules and passed the final examination with<div class="score">'+S.best.score+' / '+N_EXAM+' ('+S.best.pct+'%)</div>Passing criterion: '+PASS_PCT+'%<div style="font-size:.95cqw;color:#555;margin-top:.5cqw">Course based on the book by Dr. Babaso Vitthal Udugade and Mrs. Swati Babaso Udugade</div></div>'+
    '<div class="foot3">'+
      '<div class="sg"><img src="'+SIG+'" alt="Signature of Dr. B.V. Udugade"><div class="ln"><b>Dr. B.V. Udugade</b><span>Founder &amp; CEO</span><span>Maharashtra Academy of Skills and Knowledge</span></div></div>'+
      '<div>'+seal+'</div>'+
      '<div class="sg dt"><div class="val">'+esc(ds)+'</div><div class="ln"><b>Date of completion</b></div></div>'+
    '</div>'+
   '</div>'+
  '</div></div>'+
  '<p class="noprint" style="font-size:.85rem;color:var(--muted)">Self-study completion certificate; not an accredited qualification. For best print results choose A4 landscape and enable background graphics.</p>'+
  '<div class="actions noprint"><button class="btn ghost" data-go="exam">Back to exam</button><button class="btn" id="printBtn">Print / save as PDF</button></div>'+foot();
  $("#nm").addEventListener("input",function(e){S.name=e.target.value.trim();save();$("#certName").textContent=S.name||"Your Name";});
  $("#clg").addEventListener("input",function(e){S.college=e.target.value.trim();save();$("#certClg").innerHTML=clgHTML(S.college);});
  $("#printBtn").addEventListener("click",function(){window.print();});
}

/* ---------- events ---------- */
document.addEventListener("click",function(ev){
  var t=ev.target.closest("button,a");if(!t)return;
  if(t.dataset.signout){sb.auth.signOut();return;}
  if(t.dataset.authmode){authMode=t.dataset.authmode;authMsg=null;render();return;}
  if(t.dataset.r){go(t.dataset.r);return;}
  if(t.dataset.go){go(t.dataset.go);return;}
  if(t.dataset.done){var id=+t.dataset.done;S.done[id]=!S.done[id];if(!S.done[id])delete S.done[id];save();viewModuleRefresh(id);return;}
  if(t.dataset.reset){if(confirm("Reset all progress, quiz answers and exam scores on this device?")){S={done:{},checks:{},name:"",best:null};E=null;save();render();}return;}
  if(t.dataset.resetchk){var mid=+t.dataset.resetchk;delete S.checks[mid];Object.keys(orderCache).forEach(function(k){if(k.indexOf(mid+"-")===0)delete orderCache[k];});save();viewModuleRefresh(mid);return;}
  if(t.classList.contains("opt")&&t.dataset.mod){ // module check answer
    var mi=+t.dataset.mod,qi=+t.dataset.q,orig=+t.dataset.orig;
    S.checks[mi]=S.checks[mi]||{};if(S.checks[mi][qi]!==undefined)return;S.checks[mi][qi]=orig;save();
    var mod=MODS.filter(function(x){return x.id===mi;})[0],fs=t.closest("fieldset");
    var tmp=document.createElement("div");tmp.innerHTML=questionHTML(mod,mod.check[qi],qi,orig);
    fs.replaceWith(tmp.firstElementChild);scoreChk(mod);
    var nf=document.querySelector('fieldset[data-qi="'+qi+'"] .why');if(nf)nf.scrollIntoView({block:"nearest",behavior:"smooth"});
    return;
  }
  if(t.classList.contains("opt")&&t.dataset.ei!==undefined&&E&&!E.submitted){
    var ei=+t.dataset.ei;E.qs[ei].pick=+t.dataset.orig;
    t.closest(".opts").querySelectorAll(".opt").forEach(function(b){var on=(+b.dataset.orig===E.qs[ei].pick);b.classList.toggle("sel",on);b.setAttribute("aria-pressed",on);});
    updateExamCount();return;
  }
  if(t.dataset.startexam){newAttempt();render();return;}
  if(t.dataset.submit){
    var un=E.qs.filter(function(q){return q.pick===null;}).length;
    if(un&&!confirm(un+" question"+(un===1?" is":"s are")+" unanswered and will be marked wrong. Submit anyway?"))return;
    E.submitted=true;grade();render();return;
  }
  if(t.dataset.filter){E.filter=t.dataset.filter;viewResult($("#page"));window.scrollTo({top:$(".filters").offsetTop-80});return;}
});
function viewModuleRefresh(id){ // re-render without jumping to top
  var y=window.scrollY;render();window.scrollTo(0,y);
}
document.addEventListener("submit",function(ev){
  var f=ev.target;if(!f.classList||!f.classList.contains("authform"))return;ev.preventDefault();
  var email=f.email?f.email.value.trim():"",pw=f.password?f.password.value:"",btn=f.querySelector("button[type=submit]"),mode=f.dataset.mode,p,back=location.href.split("#")[0];
  btn.disabled=true;authMsg=null;authEmail=email;if(f.fullname)authName=f.fullname.value;
  if(mode==="in")p=sb.auth.signInWithPassword({email:email,password:pw});
  else if(mode==="up")p=sb.auth.signUp({email:email,password:pw,options:{data:{full_name:f.fullname.value.trim()},emailRedirectTo:back}});
  else if(mode==="forgot")p=sb.auth.resetPasswordForEmail(email,{redirectTo:back});
  else p=sb.auth.updateUser({password:pw});
  p.then(function(r){
    btn.disabled=false;
    if(r.error){authMsg={t:"err",m:r.error.message};}
    else if(mode==="up"&&!(r.data&&r.data.session)){authMsg={t:"ok",m:"Account created. Check your email to confirm it, then sign in."};authMode="in";}
    else if(mode==="forgot"){authMsg={t:"ok",m:"If that email has an account, a reset link is on its way."};}
    else if(mode==="newpw"){recovery=false;authMsg=null;}
    else return;
    render();
  },function(e){btn.disabled=false;authMsg={t:"err",m:"Network error. Please try again."};render();});
});
$("#menuBtn").addEventListener("click",function(){var s=$("#side"),o=s.classList.toggle("open");this.setAttribute("aria-expanded",o);});
$("#themeBtn").addEventListener("click",function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var sysDark=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
  var next=cur?(cur==="dark"?"light":"dark"):(sysDark?"light":"dark");
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem(KEY+"-theme",next);}catch(e){}
});
try{var th=localStorage.getItem(KEY+"-theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}
window.addEventListener("hashchange",function(){if(route()!=="exam"&&E&&E.submitted){E=null;}render();});
render();
})();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accidental Discoveries: The Course</title>
<meta name="description" content="A 10-module self-study course on the serendipitous discoveries behind life-saving medicines, with a 25-question final exam.">
<style>
:root{
  --bg:#f5f0e6; --panel:#fffdf8; --ink:#1e2a2d; --muted:#5d6a6d; --line:#ddd2bd;
  --accent:#0e6a63; --accent-ink:#ffffff; --accent-soft:#dcefec;
  --gold:#a9741a; --gold-soft:#f8ecd2;
  --ok:#1b7a3d; --ok-soft:#def3e3; --bad:#b3261e; --bad-soft:#fbe4e1;
  --shadow:0 1px 2px rgba(60,40,10,.06),0 8px 24px rgba(60,40,10,.07);
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121819; --panel:#1b2325; --ink:#e9e5da; --muted:#9ba7aa; --line:#2e3a3d;
    --accent:#4cc3b8; --accent-ink:#082220; --accent-soft:#163230;
    --gold:#e0b25c; --gold-soft:#332a16;
    --ok:#74d493; --ok-soft:#14301f; --bad:#ff8c82; --bad-soft:#391c1a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#121819; --panel:#1b2325; --ink:#e9e5da; --muted:#9ba7aa; --line:#2e3a3d;
  --accent:#4cc3b8; --accent-ink:#082220; --accent-soft:#163230;
  --gold:#e0b25c; --gold-soft:#332a16;
  --ok:#74d493; --ok-soft:#14301f; --bad:#ff8c82; --bad-soft:#391c1a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:17px;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--serif);line-height:1.25;color:var(--ink)}
h1{font-size:clamp(1.7rem,4vw,2.4rem);margin:.2em 0 .3em;letter-spacing:-.01em}
h2{font-size:1.35rem;margin:1.6em 0 .5em}
h3{font-size:1.2rem;margin:1.8em 0 .5em;padding-bottom:.3em;border-bottom:1px solid var(--line)}
p{margin:.7em 0}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{font-family:var(--serif);font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-family:var(--sans);font-weight:500;color:var(--muted);margin-left:8px;font-size:.78rem}
.spacer{flex:1}
.progress{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);min-width:0}
.bar{width:140px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.iconbtn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:6px 10px;font-size:.85rem}
.iconbtn:hover{background:var(--accent-soft)}
#menuBtn{display:none}

/* layout */
.layout{display:grid;grid-template-columns:310px minmax(0,1fr);max-width:1280px;margin:0 auto}
nav.side{position:sticky;top:58px;align-self:start;height:calc(100vh - 58px);overflow:auto;padding:18px 14px 30px 16px;border-right:1px solid var(--line)}
nav.side h4{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 6px 6px}
.navitem{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:9px 10px;border-radius:10px;font-size:.92rem;line-height:1.35}
.navitem:hover{background:var(--accent-soft)}
.navitem[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.navitem .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.72rem;font-weight:700;margin-top:1px}
.navitem[aria-current="page"] .dot{border-color:var(--accent-ink)}
.navitem.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.navitem.locked{opacity:.55}
main{padding:28px clamp(16px,4vw,48px) 80px;min-width:0}
.page{max-width:820px;margin:0 auto}
.eyebrow{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700}
.sub{color:var(--muted);font-size:1.08rem;margin-top:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);margin:18px 0}
.objectives{border-left:5px solid var(--accent)}
.objectives h2{margin-top:0;font-size:1.05rem;font-family:var(--sans);text-transform:uppercase;letter-spacing:.06em}
.objectives ul{margin:.4em 0 0;padding-left:1.2em}
.content ul{padding-left:1.25em}
.content li{margin:.35em 0}
.content table{width:100%;border-collapse:collapse;margin:1em 0;font-size:.93rem;display:block;overflow-x:auto}
.content th,.content td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.content th{background:var(--accent-soft);font-weight:700}
.content tr:nth-child(even) td{background:color-mix(in srgb,var(--panel) 92%,var(--line))}
.callout{border-radius:12px;padding:12px 16px;margin:1.2em 0;border:1px solid var(--line);font-size:.97rem}
.callout.myth{background:var(--gold-soft);border-color:var(--gold)}
.callout.analyst{background:var(--accent-soft);border-color:var(--accent)}
.callout.tip{background:color-mix(in srgb,var(--panel) 85%,var(--accent-soft))}
.callout b:first-child{display:inline-block;margin-right:.3em}
.keypoints{background:var(--accent-soft);border:1px solid var(--accent);border-radius:16px;padding:16px 20px;margin:28px 0}
.keypoints h2{margin:0 0 .3em;font-size:1.15rem}
.keypoints ul{margin:0;padding-left:1.2em}

/* quiz */
.q{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px 16px;margin:14px 0}
.q legend,.q .qtext{font-weight:650;padding:0 4px}
.qmeta{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 12px;border-radius:10px;font-size:.96rem;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:.76rem;font-weight:700}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default}
.tag{margin-left:auto;flex:none;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.ok{background:var(--ok);color:#fff}.tag.no{background:var(--bad);color:#fff}
.why{margin-top:10px;font-size:.92rem;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--panel) 90%,var(--line));border-left:4px solid var(--accent)}
.why.ok{border-left-color:var(--ok)} .why.no{border-left-color:var(--bad)}
.score{font-weight:700;color:var(--accent)}

/* buttons */
.btn{border:0;border-radius:12px;padding:11px 20px;font-weight:650;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--accent-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:30px}
.actions .grp{display:flex;gap:10px;flex-wrap:wrap}

/* home */
.hero{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#14343a));color:var(--accent-ink);border-radius:22px;padding:clamp(22px,4vw,40px);box-shadow:var(--shadow)}
.hero h1{color:inherit;margin-top:6px}
.hero p{color:inherit;opacity:.93;font-size:1.05rem}
.hero .eyebrow{color:inherit;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}
.mcard{text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.mcard:hover{border-color:var(--accent)}
.mcard .n{font-size:.74rem;color:var(--gold);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.mcard .t{font-family:var(--serif);font-weight:700;margin:4px 0;line-height:1.3}
.mcard .s{font-size:.8rem;color:var(--muted)}
.mcard.done{border-color:var(--ok)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.rules div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.rules b{display:block;font-size:1.6rem;font-family:var(--serif);color:var(--accent)}
.rules span{font-size:.8rem;color:var(--muted)}

/* exam result */
.result{text-align:center;padding:26px 18px;border-radius:20px;border:2px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}
.result.pass{border-color:var(--ok);background:var(--ok-soft)}
.result.fail{border-color:var(--bad);background:var(--bad-soft)}
.result .big{font-family:var(--serif);font-size:clamp(2.4rem,8vw,4rem);font-weight:700;line-height:1}
.result .verdict{font-size:1.3rem;font-weight:800;letter-spacing:.06em;margin-top:8px}
.result.pass .verdict,.result.pass .big{color:var(--ok)}
.result.fail .verdict,.result.fail .big{color:var(--bad)}
.mbreak{display:grid;gap:6px;margin:10px 0}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 110px 46px;gap:10px;align-items:center;font-size:.86rem}
.mrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .tr{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.mrow .tr i{display:block;height:100%;background:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:6px 14px;font-size:.86rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sticky-prog{position:sticky;top:58px;z-index:10;background:var(--bg);padding:8px 0;font-size:.9rem;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.lock{text-align:center;padding:30px 16px}
.lock .big{font-size:3rem}

/* certificate */
.certwrap{margin:20px 0;overflow:hidden}
.cert{--navy:#12307a;--sky:#bcd9e8;--gold:#c8962b;position:relative;container-type:inline-size;aspect-ratio:297/210;width:100%;background:#fff;color:#1b1b1b;font-family:var(--serif);overflow:hidden;border:1px solid #d8d8d8;box-shadow:var(--shadow)}
.cert .tri{position:absolute;width:13%;aspect-ratio:1;}
.cert .tl1{left:0;top:0;background:var(--sky);clip-path:polygon(0 0,100% 0,0 100%)}
.cert .tl2{left:4.5%;top:0;width:11%;background:var(--navy);clip-path:polygon(0 0,100% 0,0 100%);transform:none}
.cert .br1{right:0;bottom:0;background:var(--sky);clip-path:polygon(100% 0,100% 100%,0 100%)}
.cert .br2{right:4.5%;bottom:0;width:11%;background:var(--navy);clip-path:polygon(100% 0,100% 100%,0 100%)}
.cert .frame{position:absolute;inset:4.2% 4.6%;border:.18cqw solid var(--navy)}
.cert .in{position:absolute;inset:5.6% 8%;display:flex;flex-direction:column;align-items:center;text-align:center}
.cert .logo{height:12.5cqw;width:auto;display:block;margin-top:.4cqw}
.cert .t1{font-family:var(--sans);font-weight:800;letter-spacing:.55cqw;font-size:4.7cqw;line-height:1;margin-top:.6cqw;color:#0b0b0b}
.cert .t2{font-family:var(--sans);letter-spacing:.7cqw;font-size:1.7cqw;margin-top:.5cqw;color:#222}
.cert .course{font-style:italic;font-size:1.55cqw;margin-top:.9cqw;color:var(--navy);font-weight:700}
.cert .course small{display:block;font-style:normal;font-weight:400;font-size:1.05cqw;color:#555;margin-top:.1cqw}
.cert .aw{font-family:var(--sans);font-size:1.05cqw;letter-spacing:.12cqw;margin-top:1.3cqw;color:#222}
.cert .nm{font-size:4cqw;line-height:1.1;margin-top:.5cqw;color:#0b0b0b;font-weight:400;text-transform:uppercase;letter-spacing:.1cqw;max-width:100%;overflow-wrap:anywhere}
.cert .clg{font-family:var(--sans);font-size:1.35cqw;margin-top:.5cqw;color:#222}
.cert .clg b{font-weight:700;color:var(--navy)}
.cert .body{font-family:var(--sans);font-size:1.12cqw;line-height:1.55;margin-top:.9cqw;color:#222;max-width:78%}
.cert .score{font-size:2cqw;font-weight:700;color:var(--navy);margin-top:.3cqw}
.cert .foot3{position:absolute;left:0;right:3%;bottom:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:2cqw}
.cert .sg{font-family:var(--sans);text-align:center}
.cert .sg img{height:6.2cqw;width:auto;display:block;margin:0 auto .3cqw;position:relative;z-index:1;}
.cert .sg .ln{border-top:.14cqw solid #111;margin:0 auto;width:86%;padding-top:.35cqw}
.cert .sg b{display:block;font-size:1.15cqw;letter-spacing:.05cqw}
.cert .sg span{display:block;font-size:.95cqw;color:#333}
.cert .sg.dt .val{font-size:1.25cqw;font-weight:700;height:5.4cqw;display:flex;align-items:flex-end;justify-content:center;padding-bottom:.4cqw}
.cert .seal{width:8cqw;height:auto;display:block}
.cert .fine{position:absolute;left:0;right:0;bottom:-3.1cqw;font-family:var(--sans);font-size:.8cqw;color:#555}
.namefield{width:100%;max-width:420px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}

.userbox{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);min-width:0}
.userbox .em{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.authing nav.side,body.authing #menuBtn,body.authing .progress{display:none}
body.authing .layout{display:block}
.authcard{max-width:440px;margin:30px auto}
.authcard h1{font-size:1.6rem;margin-top:0}
.authtabs{display:flex;gap:6px;margin:14px 0}
.authform label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 4px}
.authform input{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.authform .btn{width:100%;margin-top:16px}
.amsg{padding:10px 12px;border-radius:10px;font-size:.9rem;margin:12px 0}
.amsg.err{background:var(--bad-soft);border:1px solid var(--bad)}
.amsg.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;padding:0;font-size:.88rem}
footer.foot{margin-top:50px;padding-top:16px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted)}

@media (max-width:900px){
  .layout{display:block}
  #menuBtn{display:inline-block}
  nav.side{position:fixed;inset:58px 0 0 0;height:auto;background:var(--panel);z-index:25;transform:translateX(-102%);transition:transform .25s;max-width:340px;box-shadow:var(--shadow)}
  nav.side.open{transform:none}
  .bar{width:70px}
  .brand small{display:none}
}
@media (max-width:520px){
  .userbox .em{display:none}
  body{font-size:16px}
  .progress span.lbl{display:none}
  .bar{width:44px}
  .brand{font-size:.95rem}
  .topbar{gap:8px;padding:8px 10px}
  .mrow{grid-template-columns:minmax(0,1fr) 70px 40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{
  body *{visibility:hidden}
  #certArea,#certArea *{visibility:visible}
  #certArea{position:absolute;left:0;top:0;width:100%}
  .noprint{display:none!important}
  @page{size:A4 landscape;margin:0}
  html,body{background:#fff!important}
  .certwrap{margin:0}
  #certArea{width:297mm}
  .cert{width:297mm;border:0;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<header class="topbar noprint">

  <div class="spacer"></div>
  <div class="progress" aria-live="polite"><span class="lbl" id="progLbl">0 / 10 modules</span><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progBar"><i></i></div></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== SUPABASE LOGIN SETTINGS =====
   Paste your project values here (Supabase dashboard > Project Settings > API).
   The anon key is designed to be public; your data is protected by the row-level-security
   policies in supabase_setup.sql. Leave both empty to run the course without login. */
var SUPABASE_URL = "";        // e.g. "https://abcdxyz.supabase.co"
var SUPABASE_ANON_KEY = "";   // the "anon public" key
/* ================================== */

/* Modules 1-5. In every question, option o[0] is the CORRECT answer; options are shuffled at runtime. */
const MODS_A = [
{
 id:1, tag:"Introduction", title:"The Prepared Mind", mins:15,
 sub:"What serendipity really is, why medicine attracts accidents, and the two lenses used throughout the course.",
 obj:[
  "Explain where the word serendipity comes from and why both accident and sagacity are needed",
  "Describe three reasons drug discovery is so rich in surprises",
  "Recognise the three distortions in popular discovery stories: survivorship, compression and heroism",
  "Define the key pharmacology and medicinal chemistry terms used in later modules"
 ],
 body:`
<h3>A word invented in a letter</h3>
<p>In January 1754 the English writer <b>Horace Walpole</b> wrote to a friend in Florence about a Persian fairy tale of three princes from <b>Serendip</b> (today's Sri Lanka). The princes kept finding things they were not looking for, by <i>"accidents and sagacity."</i> Walpole coined <b>serendipity</b> for that habit.</p>
<h3>Two ingredients</h3>
<p>Both parts of Walpole's phrase are needed. <b>Accidents</b> supply the surprise. <b>Sagacity</b>, the ability to see what a surprise might be worth, turns it into knowledge. Contaminated plates are common in every microbiology lab; Fleming noticed the clear ring of dead bacteria. <b>Louis Pasteur</b> (Lille, 1854): <i>"In the fields of observation, chance favours only the prepared mind."</i></p>
<p>Preparation looks different in each story: Fleming had studied the body's natural antibacterial defences, Hofmann worked daily with ergot alkaloids, and Karl Paul Link took a farmer's dead cow seriously.</p>
<h3>Why medicine attracts accidents</h3>
<ul>
 <li><b>Crowded biology.</b> A drug meets thousands of proteins and often binds a few it was not built for. A side effect is simply an effect nobody was looking for.</li>
 <li><b>Scale.</b> Screening hundreds of thousands of compounds guarantees odd results; the productive lab looks at the odd result twice.</li>
 <li><b>Humans are the last experimental system.</b> Iproniazid cheered tuberculosis patients and sildenafil affected men in a heart trial. Neither effect would have shown up in an animal cage.</li>
</ul>
<h3>The danger of a good story</h3>
<table>
 <tr><th>Distortion</th><th>What goes wrong</th></tr>
 <tr><td><b>Survivorship</b></td><td>We hear about the one mould that worked, not the thousands of contaminated plates that produced nothing.</td></tr>
 <tr><td><b>Compression</b></td><td>"Fleming discovers penicillin in 1928" hides more than a decade of failed purification, a war, and industrial effort on two continents.</td></tr>
 <tr><td><b>Heroism</b></td><td>Drug discovery is almost never solitary: Prontosil needed a chemistry team, and metformin was found, forgotten and refound in three countries.</td></tr>
</table>
<h3>Two lenses</h3>
<p>The <b>medicinal chemist</b> asks about structure: which atoms, which groups are essential, what can be changed (<b>structure-activity relationships, SAR</b>). The <b>pharmacologist</b> asks about action: what does the drug bind, what follows (<b>mechanism of action, MoA</b>), and how is it absorbed, distributed, metabolised and excreted. A structure with no mechanism is only a drawing; a mechanism with no structure cannot be improved.</p>
<div class="callout tip"><b>The toolbox: eight terms</b>
<ul>
 <li><b>Agonist / antagonist</b>: activates a receptor / binds but blocks the natural signal.</li>
 <li><b>Inhibitor</b>: lowers enzyme activity; competitive ones compete with the substrate, irreversible ones form a lasting covalent bond.</li>
 <li><b>Pharmacophore</b>: the minimum structural features needed to bind the target and act.</li>
 <li><b>Prodrug</b>: inactive until the body converts it to the active drug.</li>
 <li><b>Selectivity</b>: acting on the intended target rather than related ones.</li>
 <li><b>Therapeutic index</b>: the gap between the dose that helps and the dose that harms.</li>
 <li><b>Bioavailability</b>: fraction of a dose reaching the circulation in active form.</li>
 <li><b>Half-life</b>: time for the drug concentration in the body to fall by half.</li>
</ul></div>
<h3>The eight main accidents at a glance</h3>
<table>
 <tr><th>Medicine</th><th>Period</th><th>What happened instead</th><th>Target</th></tr>
 <tr><td>Penicillin</td><td>1928</td><td>Mould cleared bacteria on a plate</td><td>Penicillin-binding proteins</td></tr>
 <tr><td>Prontosil / sulfonamides</td><td>1932–35</td><td>Dye failed in vitro, protected infected animals</td><td>Dihydropteroate synthase</td></tr>
 <tr><td>Sildenafil</td><td>1990s</td><td>Trial volunteers reported erections</td><td>PDE5</td></tr>
 <tr><td>Warfarin</td><td>1920s–50s</td><td>Spoiled clover anticoagulant → rodenticide → medicine</td><td>VKORC1</td></tr>
 <tr><td>LSD</td><td>1938–43</td><td>Unplanned exposure altered perception</td><td>5-HT<sub>2A</sub> receptor</td></tr>
 <tr><td>Iproniazid</td><td>1951–52</td><td>TB patients became elated</td><td>Monoamine oxidase</td></tr>
 <tr><td>Nitrogen mustards</td><td>1942–46</td><td>Mustard destroyed white cells → lymphoma therapy</td><td>DNA (alkylation)</td></tr>
 <tr><td>Metformin</td><td>1920s–50s</td><td>Glucose lowering seen in unrelated use</td><td>Cellular energy sensing (AMPK)</td></tr>
</table>
<div class="callout tip"><b>Study habit:</b> whenever you meet a structure, guess which part is the "business end" before reading on. That is exactly the exercise a medicinal chemist performs.</div>`,

{
 id:2, tag:"Chapter 1", title:"The Moldy Petri Dish: Penicillin", mins:30,
 sub:"A mould, a stalled decade, a bedpan laboratory in Oxford and a strained four-membered ring that changed medicine.",
 obj:[
  "Narrate the path from Fleming's 1928 observation to mass production in the 1940s",
  "Explain why the β-lactam ring is reactive and how side-chain changes alter the drug",
  "Describe how penicillin inhibits cell-wall cross-linking and why humans are spared",
  "List the three resistance mechanisms and how clavulanic acid counters one of them"
 ],
 body:`
<h3>The serendipitous event</h3>
<ul>
 <li><b>1921:</b> a drop of Fleming's own nasal mucus dissolved bacteria on a plate, which revealed <b>lysozyme</b>. It led to no drug, but taught him that the body has natural antibacterial substances.</li>
 <li><b>September 1928</b> (St Mary's Hospital, London): a plate left during his holiday was invaded by a blue-green mould, and staphylococcal colonies around it had vanished. Fleming kept the plate, grew the mould in broth ("mould juice") and in 1929 named the active substance <b>penicillin</b>. The species is now placed as <i>Penicillium rubens</i>.</li>
 <li><b>Ten quiet years:</b> Fleming could not purify the unstable substance, and interest was low.</li>
 <li><b>Oxford, 1938 onward:</b> <b>Florey, Chain and Heatley</b> developed an extraction method. In <b>May 1940</b> four of eight mice given lethal streptococci and treated with penicillin survived.</li>
 <li><b>1941:</b> policeman <b>Albert Alexander</b> improved dramatically, but supply ran out (even his urine was recycled) and he died. Florey and Heatley took the work to <b>Peoria, Illinois</b>.</li>
 <li><b>Peoria:</b> corn steep liquor and lactose boosted yield; a cantaloupe strain found by Mary Hunt (<i>P. chrysogenum</i>, 1943) was mutated and improved; deep-tank fermentation replaced flat vessels. <b>Anne Miller</b> recovered from sepsis in March 1942. By D-Day (June 1944) supply was sufficient for Allied wounded.</li>
 <li><b>1945:</b> Nobel Prize to Fleming, Florey and Chain. Fleming warned about resistance in his lecture.</li>
</ul>
<div class="callout myth"><b>Myth and Record</b> The tale that Fleming saved Churchill with penicillin is invented: Churchill's 1943 pneumonia was treated with a sulfonamide, <b>M&amp;B 693</b>. The weather-and-open-window reconstruction of the contamination is also disputed.</div>
<h3>The chemist's bench</h3>
<p>Penicillin is a fused bicycle: a five-membered <b>thiazolidine</b> and a four-membered <b>β-lactam</b>, the pharmacophore. The ring is strained (≈90° bond angles). The fused geometry forces nitrogen to be pyramidal, so its lone pair cannot resonate with the carbonyl; the carbonyl behaves like an acid anhydride and readily acylates nucleophiles. That reactivity makes penicillin both active and fragile (water, acid and β-lactamases open the ring).</p>
<p>The structure was settled by <b>Dorothy Hodgkin's</b> X-ray crystallography in 1945, supporting Chain and Abraham's β-lactam over Robinson's oxazolone proposal.</p>
<table>
 <tr><th>Drug</th><th>Side chain (C-6)</th><th>What it achieves</th></tr>
 <tr><td>Penicillin G</td><td>Benzyl</td><td>Narrow spectrum; destroyed by acid and penicillinase</td></tr>
 <tr><td>Penicillin V</td><td>Phenoxymethyl</td><td>Acid-stable, so oral</td></tr>
 <tr><td>Methicillin / flucloxacillin</td><td>Bulky groups</td><td>Resist penicillinase</td></tr>
 <tr><td>Ampicillin / amoxicillin</td><td>α-Aminobenzyl</td><td>Wider spectrum, good oral absorption</td></tr>
 <tr><td>Piperacillin</td><td>Acylureido</td><td>Extended spectrum incl. <i>Pseudomonas</i>; given with tazobactam</td></tr>
</table>
<ul>
 <li>In penicillin G the side-chain carbonyl oxygen attacks the β-lactam in acid; an electron-withdrawing oxygen (penicillin V) suppresses this.</li>
 <li><b>6-APA</b> (Beecham, 1957–59) is the core without a side chain; any acyl group can be attached to make semisynthetic penicillins.</li>
 <li>Essential: bicyclic fusion, the C-3 carboxylic acid and correct stereochemistry. Esterifying the acid largely abolishes activity.</li>
 <li><b>Clavulanic acid</b> (from <i>Streptomyces</i>), sulbactam and tazobactam are <b>suicide inhibitors</b> of β-lactamases, rescuing amoxicillin or piperacillin.</li>
</ul>
<div class="callout analyst"><b>Analyst's corner</b> Early standardisation was biological (zone size; Oxford unit). Classical chemistry: iodometric assay after alkaline ring-opening to penicilloic acid; hydroxamic acid / iron(III) colour test. Today: HPLC. 1 mg sodium benzylpenicillin = <b>1,667 IU</b>. Penicillins are most stable near neutral pH; amoxicillin suspensions are supplied as powder for reconstitution. Polymeric impurities are linked to allergy and are limited by pharmacopoeias.</div>
<h3>The pharmacologist's lab</h3>
<p>Bacteria need a rigid <b>peptidoglycan</b> wall. The last step is cross-linking of peptide stems by <b>transpeptidases</b>, which cut off the terminal <b>D-Ala</b>. These enzymes are the <b>penicillin-binding proteins (PBPs)</b>. Strominger and Tipper (1965) proposed that penicillin mimics the <b>D-Ala-D-Ala</b> end of the stem. A serine in the active site attacks the β-lactam; the ring opens, and the stable <b>penicilloyl-enzyme</b> traps the transpeptidase.</p>
<ul>
 <li><b>Why bactericidal, and mostly vs growing cells:</b> autolysins keep cutting the wall while cross-linking fails, so the cell lyses. Resting cells make little wall.</li>
 <li><b>Why safe:</b> human cells have no peptidoglycan wall.</li>
 <li><b>Gram-negatives</b> have an outer membrane; drugs enter through porins, and polar groups (ampicillin's amine) help.</li>
 <li><b>Pharmacokinetics:</b> penicillin G is cleared by renal tubular secretion, t½ ≈ 0.5 h; <b>probenecid</b> prolongs action; poorly soluble <b>benzathine penicillin G</b> gives weeks of release (syphilis, rheumatic fever prophylaxis). Killing depends on time above the minimum inhibitory concentration.</li>
 <li><b>Adverse effect:</b> allergy (opened ring haptenises proteins), though many self-reported allergies are not confirmed on testing.</li>
 <li><b>Resistance:</b> (1) β-lactamases (described 1940, before general use), (2) altered PBPs (MRSA carries <b>PBP2a</b>), (3) reduced entry or increased export.</li>
</ul>
<h3>Legacy</h3>
<p>Penicillin showed microbes can be a drug source (Waksman's soil screening gave streptomycin; cephalosporins came from a Sardinian sewage-outfall mould), and gave industry a template for scale-up. In India, <b>Hindustan Antibiotics Limited</b> (Pimpri, 1954) began penicillin production in 1955 as the country's first public-sector pharma company. Every dose of an antibiotic is a selection experiment on bacteria.</p>`,
 key:[
  "Fleming (1928) observed it; Florey, Chain and Heatley made it a drug; Peoria's fermentation science made it plentiful.",
  "The pharmacophore is the strained β-lactam fused to a thiazolidine; C-6 side chains control acid stability, spectrum and enzyme resistance.",
  "Penicillin mimics D-Ala-D-Ala, acylates the serine of PBPs (transpeptidases) and blocks peptidoglycan cross-linking; humans lack this wall.",
  "Resistance: β-lactamases, altered PBPs (PBP2a in MRSA), reduced entry. Clavulanic acid, sulbactam and tazobactam inhibit β-lactamases."

{
 id:3, tag:"Chapter 2", title:"The Dye That Cured Infections: Prontosil and the Sulfonamides", mins:30,
 sub:"A red dye that did nothing in a test tube, saved infected mice, and revealed the prodrug and antimetabolite concepts.",
 obj:[
  "Explain why Domagk's choice of an animal model was crucial",
  "Show how Prontosil is a prodrug and how sulfanilamide mimics PABA",
  "Apply the sulfonamide SAR rules, including the role of N1 and pKa",
  "Describe the bacterial folate pathway and the rationale of co-trimoxazole"
 ],
 body:`
<h3>The serendipitous event</h3>
<p>By 1930 no treatment existed for streptococcal sepsis, pneumococcal pneumonia or puerperal fever. <b>Paul Ehrlich</b> had dreamed of <i>Zauberkugeln</i> ("magic bullets"); his arsenical Salvarsan (compound 606, 1910) was one. Dye companies, merged into I. G. Farben in 1925, held thousands of synthetic dyes.</p>
<ul>
 <li><b>Gerhard Domagk</b> (Bayer, Elberfeld, from 1927) screened azo dyes made by Mietzsch and Klarer, and chose to test them in <b>mice infected with haemolytic streptococci</b> rather than in culture.</li>
 <li><b>December 1932:</b> the red dye <b>KL 730 (Prontosil rubrum)</b> protected mice, yet <b>did nothing in a dish</b>. A culture-only screen would have discarded it.</li>
 <li><b>1935</b> (Pasteur Institute: Fourneau, the Tréfouëls, Nitti, Bovet): the body cleaves the azo bond and releases colourless <b>sulfanilamide</b>, which carries all the activity. Prontosil is a <b>prodrug</b>. Sulfanilamide had been made by Gelmo in 1908 and was out of patent, which broke Bayer's monopoly.</li>
 <li><b>1936:</b> Colebrook and Kenny (London) showed sharp falls in puerperal fever deaths. Domagk received the <b>1939 Nobel Prize</b> but was forbidden by the Nazi government to accept it (medal received in 1947).</li>
 <li><b>1937: Elixir Sulfanilamide.</b> Massengill dissolved the drug in <b>diethylene glycol</b> without safety testing; &gt;100 people died. The result was the US <b>Federal Food, Drug, and Cosmetic Act of 1938</b> (safety must be shown before sale).</li>
</ul>
<div class="callout myth"><b>Myth and Record</b> The story of Domagk saving his daughter Hildegard's arm is hard to verify and may be embellished. Sulfonamides are not strictly "the first antibiotics" (an antibiotic is made by a microorganism); they are the first broadly effective <i>antibacterial</i> drugs.</div>
<h3>The chemist's bench</h3>
<p>Prontosil has two rings joined by an <b>azo (N=N)</b> group, which makes it a dye; reduction splits it into sulfanilamide and a triaminobenzene. Sulfanilamide resembles <b>p-aminobenzoic acid (PABA)</b>: both are para-substituted benzenes with an amino group opposite an acidic group. The sulfonamide is a <b>bioisostere</b> of the carboxylate. <b>Woods and Fildes (1940)</b> showed PABA cancels sulfanilamide's effect, giving the <b>antimetabolite concept</b>.</p>
<table>
 <tr><th>Feature</th><th>Requirement</th><th>Reason</th></tr>
 <tr><td>Aromatic amine (N4)</td><td>Free, or released in the body</td><td>Corresponds to PABA's amino group</td></tr>
 <tr><td>Benzene ring</td><td>1,4 (para) substitution only</td><td>Spacing matches PABA</td></tr>
 <tr><td>Sulfonamide</td><td>S bonded directly to ring and N</td><td>Isostere of carboxylate</td></tr>
 <tr><td>N1 substituent</td><td>Electron-withdrawing heterocycle</td><td>Lowers pKa to ≈6–7; raises potency; tunes solubility and half-life</td></tr>
 <tr><td>N4 acetylation</td><td>Abolishes activity</td><td>Loses free amine; acetyl metabolite is less soluble</td></tr>
</table>
<ul>
 <li>Early sulfonamides (sulfapyridine, sulfathiazole) could crystallise in the kidney, so solubility became a design goal.</li>
 <li><b>Sulfasalazine</b> (Nanna Svartz, 1940s) joins sulfapyridine to 5-aminosalicylic acid by an azo bond; colonic bacteria cleave it, delivering 5-ASA to the bowel wall in ulcerative colitis, a deliberate azo-prodrug delivery system.</li>
</ul>
<div class="callout analyst"><b>Analyst's corner</b> The free aromatic primary amine allows <b>diazotisation titration</b> with sodium nitrite in cold HCl (end point by external starch-iodide or potentiometry). The <b>Bratton–Marshall</b> colorimetric method couples the diazonium salt with N-(1-naphthyl)ethylenediamine to give an intensely coloured azo dye, used for blood and urine. Sulfonamides darken in light.</div>
<h3>The pharmacologist's lab</h3>
<p>Bacteria must synthesise folate; the first committed step joins PABA to a pteridine, catalysed by <b>dihydropteroate synthase (DHPS)</b>; <b>dihydrofolate reductase (DHFR)</b> acts later. Humans take folate from food and have no DHPS, explaining selectivity.</p>
<ul>
 <li>Sulfonamides are <b>competitive</b> inhibitors (overcome by PABA, hence poor activity in pus and opposition by procaine, which is broken down to PABA). They are <b>bacteriostatic</b>, relying on host defences.</li>
 <li><b>Trimethoprim</b> (Hitchings and Elion) inhibits bacterial DHFR; with sulfamethoxazole it forms <b>co-trimoxazole</b>, a sequential double block that is synergistic and can be bactericidal (UTI, <i>Pneumocystis</i> pneumonia). Hitchings and Elion shared the 1988 Nobel Prize.</li>
 <li>Metabolism: acetylation by N-acetyltransferase (genetically variable; returns with isoniazid in Module 7).</li>
 <li>Adverse effects: rash, Stevens–Johnson syndrome, crystalluria, haemolysis in G6PD deficiency, and kernicterus risk in newborns because sulfonamides displace bilirubin.</li>
 <li>Resistance: plasmid-borne DHPS insensitive to the drug, or more PABA made.</li>
</ul>
<div class="callout tip"><b>Accidents inside the accident</b> Sulfanilamide's alkaline urine (carbonic anhydrase inhibition) led to acetazolamide and the thiazide diuretics; Janbon's 1942 observation of hypoglycaemia in treated typhoid patients led to the sulfonylureas. Sulfonamide groups remain in celecoxib, sumatriptan, furosemide and sildenafil.</div>
<h3>Legacy</h3>
<p>Two enduring ideas: the <b>antimetabolite</b> (methotrexate, 5-FU, 6-MP, antiviral nucleosides) and the <b>prodrug</b>. Domagk's lesson: test in a living system.</p>`,

  "Domagk tested azo dyes in infected mice; Prontosil worked in animals but not in culture.",

  "Key SAR: free p-amino, 1,4-benzene, sulfonamide attached directly; N1 heterocycles tune pKa (6–7), potency and solubility.",

{
 id:4, tag:"Chapter 3", title:"The Angina Drug That Went South: Sildenafil", mins:25,
 sub:"A rationally designed PDE5 inhibitor for the heart whose unexpected effect launched a new therapeutic area.",
 obj:[
  "Trace the nitric oxide → cGMP → PDE5 pathway and why PDE5 was a target for angina",
  "Explain how zaprinast was optimised into sildenafil and the role of selectivity",
  "Describe why sildenafil needs stimulation and why nitrates are contraindicated",
  "Define drug repositioning and give sildenafil's two indications"
 ],
 body:`
<h3>The serendipitous event</h3>
<p>Nitroglycerin has treated angina since the 1870s. In the 1980s <b>Furchgott, Ignarro and Murad</b> showed that nitric oxide (NO) relaxes blood vessels through the second messenger <b>cGMP</b> (Nobel Prize 1998). Cells break cGMP down with <b>phosphodiesterases (PDEs)</b>; <b>PDE5</b> seemed to dominate in vascular tissue, so blocking it should help angina.</p>
<ul>
 <li>A Pfizer team at <b>Sandwich, Kent</b> (Terrett, Bell and colleagues) started from <b>zaprinast</b> (May &amp; Baker), a weak, non-selective PDE5 inhibitor. In <b>1989</b> they made UK-92,480, now <b>sildenafil</b>.</li>
 <li>As a heart drug it was mediocre (modest vasodilation, short half-life), but healthy volunteers reported <b>penile erections</b>. Pfizer changed direction.</li>
 <li>First major report (Boolell, 1996); <b>FDA approval 27 March 1998</b> as Viagra for erectile dysfunction, the first oral treatment. In <b>2005</b> low-dose Revatio was approved for <b>pulmonary arterial hypertension</b>.</li>
</ul>
<div class="callout myth"><b>Myth and Record</b> The story that volunteers refused to return their tablets comes from recollections and varies in detail. The target and molecule were carefully reasoned; what was unplanned was the <i>disease</i> it treated, the "second kind" of serendipity: the tool was designed on purpose, the use was found by accident.</div>
<h3>The chemist's bench</h3>
<p>cGMP's base is <b>guanine</b>. Zaprinast replaced the imidazole with a triazole (an 8-azapurine) but kept the hydrogen-bonding pattern. Sildenafil's <b>pyrazolo[4,3-d]pyrimidin-7-one</b> is a better guanine mimic.</p>
<table>
 <tr><th>Part of molecule</th><th>Contribution</th></tr>
 <tr><td>Pyrazolopyrimidinone core</td><td>Mimics guanine of cGMP; H-bonds to a conserved glutamine; stacks on an aromatic residue</td></tr>
 <tr><td>N-Methyl and n-propyl</td><td>Fill hydrophobic pockets, raise potency</td></tr>
 <tr><td>2-Ethoxyphenyl</td><td>Intramolecular H-bond keeps molecule flat; potency and selectivity</td></tr>
 <tr><td>Sulfonamide linker</td><td>Polar linker that orients the molecule</td></tr>
 <tr><td>N-Methylpiperazine</td><td>Selectivity over PDE3; solubility as citrate salt</td></tr>
</table>
<ul>
 <li>Potency reached low nanomolar, hundreds of times better than zaprinast.</li>
 <li><b>Selectivity:</b> several thousand-fold over PDE3 (cardiac; so no rhythm problems) but only ≈10-fold over <b>PDE6</b> (retina), which explains blue-tinged vision and light sensitivity at high exposure.</li>
 <li><b>Vardenafil</b>: related core, somewhat more potent. <b>Tadalafil</b>: carboline-based, t½ ≈ 17 h, cross-reacts with <b>PDE11</b> (skeletal muscle), linked to back pain and aches.</li>
 <li>Metabolism: <b>CYP3A4</b> (N-desmethyl metabolite, about half as active); t½ ≈ 4 h. Ketoconazole and ritonavir raise levels; a fatty meal delays absorption.</li>
</ul>
<div class="callout analyst"><b>Analyst's corner</b> Strong UV chromophore → RP-HPLC-UV; stability-indicating methods use forced degradation (acid, alkali, peroxide, heat, light); dissolution is part of release specs. Unapproved sildenafil/tadalafil analogues are found in "herbal" supplements, requiring high-resolution MS (exact mass and fragments) and handheld Raman/NIR screening.</div>
<h3>The pharmacologist's lab</h3>
<p>Sexual stimulation → NO release from nerves/endothelium in the corpus cavernosum → <b>soluble guanylate cyclase</b> makes cGMP from GTP → <b>protein kinase G</b> → lower intracellular calcium → smooth-muscle relaxation → blood fills the sinusoids and compresses venous outflow.</p>
<ul>
 <li>Sildenafil blocks PDE5, so cGMP persists. It is a <b>modulator, not an agonist</b>: without NO release there is little cGMP to protect, so <b>no erection occurs without stimulation</b>.</li>
 <li>Same mechanism in pulmonary arteries lowers pressure in PAH (different dose and schedule).</li>
 <li>Common adverse effects: headache, flushing, nasal congestion, dyspepsia; visual effects (PDE6); rare sudden vision loss; priapism needs urgent treatment.</li>
 <li><b>Absolute rule:</b> never with <b>organic nitrates</b> (glyceryl trinitrate, isosorbide mononitrate). NO donors plus prolonged cGMP can cause precipitous hypotension. Caution with alpha-blockers and guanylate cyclase stimulators.</li>
</ul>
<h3>Legacy</h3>
<p>Sildenafil popularised <b>drug repositioning</b>: known safety and PK shorten time and cost. It created a class (vardenafil, tadalafil, avanafil; tadalafil also for BPH), highlighted PDEs as tissue-specific targets (PDE3 for claudication, PDE4 for COPD and psoriasis), and showed that ED can be an early marker of vascular disease. Lesson: most adverse-event entries are noise; occasionally one is a signal.</p>`,

{
 id:5, tag:"Chapter 4", title:"The Rat Poison That Became a Medicine: Warfarin", mins:30,
 sub:"A bleeding disease of cattle, a Wisconsin blizzard, and the vitamin K cycle.",
 obj:[
  "Follow the chain from spoiled sweet clover to dicumarol to warfarin",
  "Identify the structural requirements of 4-hydroxycoumarin anticoagulants",
  "Explain the vitamin K cycle, VKORC1 inhibition, and why onset is slow",
  "List factors that influence warfarin response and how bleeding is reversed"
 ],
 body:`
<h3>The serendipitous event</h3>
<ul>
 <li><b>1920s:</b> cattle on the northern plains bled to death. <b>Frank Schofield</b> (Ontario) linked it to spoiled sweet clover hay (1922); <b>Lee Roderick</b> found prothrombin deficiency.</li>
 <li><b>February 1933:</b> farmer <b>Ed Carlson</b> drove ~190 miles through a blizzard to Madison with a dead heifer, a milk can of unclotting blood and spoiled hay. <b>Karl Paul Link's</b> lab took the problem; <b>Harold Campbell</b> crystallised the agent in June 1939: <b>dicumarol</b> (3,3′-methylenebis(4-hydroxycoumarin)), published 1941.</li>
 <li><b>Chemistry of the spoilage:</b> sweet clover contains harmless <b>coumarin</b>; moulds oxidise it to <b>4-hydroxycoumarin</b>, and two molecules join to give dicumarol.</li>
 <li><b>1941:</b> Mayo Clinic used dicumarol as the first oral anticoagulant, but it was slow and erratic.</li>
 <li><b>1948:</b> compound 42 in the series became <b>warfarin</b> (WARF + coumarin); launched as a rodenticide. In <b>1951</b> a young serviceman survived a large overdose treated with vitamin K, showing reversibility. Approved for patients in <b>1954</b> (Coumadin).</li>
</ul>
<div class="callout myth"><b>Myth and Record</b> "It saved presidents" is unsupported; the documented case is Eisenhower (1955). Warfarin does <b>not</b> thin blood; it reduces production of functional clotting factors, so "anticoagulant" is correct.</div>
<h3>The chemist's bench</h3>
<p>Coumarin is not an anticoagulant. Add a <b>4-hydroxyl</b> (acidic enol, pKa ≈ 5, largely anionic at body pH), then a <b>bulky lipophilic group at C-3</b>, and anticoagulant activity appears.</p>
<table>
 <tr><th>Feature</th><th>Requirement</th></tr>
 <tr><td>4-Hydroxyl</td><td>Essential, acidic; removing it abolishes activity</td></tr>
 <tr><td>C-3 substituent</td><td>Bulky and lipophilic; larger groups raise potency and lengthen half-life</td></tr>
 <tr><td>Lactone C=O (C-2)</td><td>Retained; part of acidic enol system</td></tr>
 <tr><td>Side-chain stereocentre</td><td>S-enantiomer more potent than R</td></tr>
</table>
<ul>
 <li>Warfarin is sold as a <b>racemate</b> and exists in equilibrium with a cyclic hemiketal. <b>S-warfarin</b> is cleared mainly by <b>CYP2C9</b>; R-warfarin by CYP1A2, CYP3A4 and others.</li>
 <li>Acenocoumarol is shorter-acting; phenprocoumon much longer; <b>superwarfarins</b> such as brodifacoum last for weeks and poison pets and wildlife.</li>
 <li>Tablets are <b>colour-coded</b> by strength (5 mg peach, 10 mg white) because of the narrow therapeutic index.</li>
</ul>
<div class="callout analyst"><b>Analyst's corner</b> Narrow therapeutic index → content and blend uniformity for low-dose tablets are safety issues (±10% can move the INR). Warfarin sodium is an isopropanol clathrate; crystalline vs amorphous forms differ in dissolution. UV-HPLC assay; chiral HPLC for enantiomers; protect from light.</div>
<h3>The pharmacologist's lab</h3>
<p>Clotting factors <b>II, VII, IX, X</b> and proteins <b>C and S</b> need glutamate residues converted to <b>γ-carboxyglutamate (Gla)</b> by γ-glutamyl carboxylase, using reduced vitamin K (hydroquinone), which is oxidised to <b>vitamin K 2,3-epoxide</b>. <b>Vitamin K epoxide reductase (VKOR)</b> recycles the epoxide. <b>Warfarin inhibits VKOR (VKORC1)</b>, so under-carboxylated, inactive factors are secreted. Factors already in the circulation are unaffected.</p>
<ul>
 <li><b>Slow onset:</b> factor VII t½ ≈ 6 h, IX ≈ 1 day, X ≈ 2 days, prothrombin ≈ 3 days; full effect takes days.</li>
 <li><b>Early trap:</b> protein C (t½ ≈ 8 h) falls first, causing a brief hypercoagulable state and rare skin necrosis. Hence <b>heparin cover</b> at initiation.</li>
 <li><b>Genes:</b> VKORC1 identified in 2004; <i>CYP2C9</i> and <i>VKORC1</i> variants explain much of the dose variation (an early pharmacogenetic label).</li>
 <li><b>Monitoring:</b> prothrombin time as <b>INR</b>; target usually 2–3.</li>
 <li><b>Interactions:</b> steady vitamin K intake (not avoidance); antibiotics reduce gut vitamin K; amiodarone, fluconazole and metronidazole inhibit CYP2C9 (↑ effect); rifampicin and St John's wort induce metabolism (↓ effect); aspirin/NSAIDs add bleeding risk.</li>
 <li><b>Bleeding</b> is the main adverse effect: reversed by <b>vitamin K</b> (hours) or factor concentrates/plasma (immediately). Teratogenic in early pregnancy.</li>
 <li><b>Today:</b> DOACs (dabigatran, rivaroxaban, apixaban) replaced it in many settings, but warfarin remains standard for <b>mechanical heart valves</b> and rheumatic mitral valve disease (a 2022 trial favoured it over rivaroxaban in AF with rheumatic mitral disease), and it is cheap.</li>
</ul>
<h3>Legacy</h3>
<p>Warfarin opened up vitamin K biology (osteocalcin in bone; matrix Gla protein in arteries), produced the INR and the anticoagulation clinic, helped start personalised medicine, and its royalties (via WARF) funded decades of University of Wisconsin research.</p>`,
 key:[
  "Spoiled sweet clover → dicumarol (Link, 1939/1941) → warfarin (1948). Rodenticide first; medicine from 1954.",
  "Essential: 4-hydroxycoumarin with a lipophilic C-3 group. Racemate; S-warfarin is more potent and cleared by CYP2C9.",
  "Warfarin inhibits VKORC1, so factors II, VII, IX and X cannot be carboxylated.",
  "Slow onset because existing factors must decay; protein C falls first, so heparin cover is used.",
  "Dose depends on genotype, diet, drugs and disease; monitor INR; vitamin K reverses it."
 ],
 check:[
  {q:"How did harmless coumarin in sweet clover become the toxic dicumarol?", o:["Moulds oxidised it to 4-hydroxycoumarin, and two molecules linked together","Cattle metabolised it in the liver","Heat during baling cross-linked it with vitamin K","It reacted with clover protein to form a prodrug"], w:"Fungal oxidation gave 4-hydroxycoumarin; dimerisation produced dicumarol."},
  {q:"What is warfarin's molecular target?", o:["Vitamin K epoxide reductase complex subunit 1 (VKORC1)","Thrombin directly","Factor Xa","Glutamyl carboxylase"], w:"VKORC1 recycles vitamin K epoxide; blocking it starves the carboxylase of reduced vitamin K."},
  {q:"Why does warfarin take several days to reach full effect?", o:["Already-circulating clotting factors must first decay","The drug is slowly absorbed","It must be activated in the kidney","It needs protein C to be converted first"], w:"It only stops new functional factors being made; their half-lives range from hours to days."},
  {q:"Which agent reverses warfarin’s effect over several hours?", o:["Vitamin K","Heparin","Protamine","Aspirin"], w:"Vitamin K restores carboxylation; concentrates or plasma act immediately in emergencies."},
  {q:"The usual INR target for most conditions on warfarin is…", o:["2 to 3","0.5 to 1","5 to 6","8 to 10"], w:"Too low risks clots; too high risks bleeding."}
 ]
}
];

 id:6, tag:"Chapter 5", title:"The Bicycle Ride into the Mind: LSD and the Ergot Alkaloids", mins:25,
 sub:"A shelved ergot derivative, an unplanned exposure in 1943, and the discovery that serotonin matters in the brain. A history-and-science module only.",
 obj:[
  "Distinguish the unplanned exposure of 16 April 1943 from the deliberate self-experiment of 19 April",
  "Relate the ergoline skeleton to serotonin's tryptamine skeleton",
  "Explain what LSD vs iso-LSD teaches about stereochemistry",
  "Describe 5-HT2A signalling and how LSD research established serotonin as a neurotransmitter"
 ],
 body:`
<div class="callout tip"><b>Note on care</b> This module covers history, chemistry concepts and pharmacology only. It is not a guide to preparing or using any substance.</div>
<h3>The serendipitous event</h3>
<p><b>Ergot</b> (sclerotia of <i>Claviceps purpurea</i> on rye) caused <b>ergotism</b>: gangrenous "St Anthony's fire" or convulsive/hallucinatory forms. Ergot was also a medicine for childbirth haemorrhage and migraine. At Sandoz (Basel), <b>Arthur Stoll</b> isolated ergotamine in 1918; <b>Albert Hofmann</b> joined in 1929.</p>
<ul>
 <li><b>1938:</b> Hofmann made the <b>25th compound</b> in a lysergic acid amide series, <b>LSD-25</b>, hoping for a circulatory stimulant like <b>nikethamide</b> (also a diethylamide). Animal tests showed only restlessness; it was shelved.</li>
 <li><b>Friday 16 April 1943:</b> while purifying a new batch, Hofmann felt restless and dizzy and had a dreamlike state with vivid colours (an <b>unplanned exposure</b>; he suspected skin absorption).</li>
 <li><b>Monday 19 April 1943:</b> a <b>deliberate self-experiment</b> with 250 µg, which he thought cautious. After the effects began he went home by bicycle; a doctor found normal pulse and blood pressure and dilated pupils. He was well next morning.</li>
 <li>Hofmann realised that microgram doses implied a very specific, sensitive biochemical target.</li>
 <li>Sandoz marketed it as Delysid from 1947; military/intelligence interest and the counterculture followed; it was banned in many countries (in India it is controlled under the NDPS Act); Sandoz stopped supply in the mid-1960s. Hofmann called it his "problem child" and lived to 102.</li>
</ul>
<div class="callout myth"><b>Myth and Record</b> The skin-absorption explanation is a hypothesis, not established fact. The "bicycle ride" is often called an accident, but it followed a <i>deliberate</i> self-experiment. This course describes the date as history and does not celebrate it.</div>
<h3>The chemist's bench</h3>
<p>Serotonin is an indole with a flexible two-carbon amine chain (tryptamine skeleton). LSD sits on the <b>ergoline</b> skeleton, four fused rings, in which that tryptamine skeleton is <b>locked into a ring</b>, making LSD a <b>conformationally restricted serotonin</b>. Lysergic acid has a C-8 carboxylic acid and a conjugated C9–C10 double bond.</p>
<table>
 <tr><th>Modification</th><th>Effect</th></tr>
 <tr><td>Diethylamide at C-8 (LSD)</td><td>Optimal among simple amides; fits a specific pocket</td></tr>
 <tr><td>Free acid or simple amide</td><td>Much weaker in the CNS</td></tr>
 <tr><td>C-8 configuration inverted (iso-LSD)</td><td>Essentially inactive</td></tr>
 <tr><td>N-6 methyl removed</td><td>Reduced potency</td></tr>
 <tr><td>9,10 double bond reduced</td><td>Loses flat conjugated system; profile changes</td></tr>
</table>
<ul>
 <li><b>iso-LSD</b> has the same formula and connectivity; only the C-8 configuration differs, and the receptor binds only one. Epimerisation can occur under basic conditions or light.</li>
 <li>The ergoline is a <b>privileged structure</b>: ergotamine and dihydroergotamine (migraine); ergometrine/methylergometrine (postpartum bleeding); bromocriptine and cabergoline (Parkinson's disease, prolactin disorders); methysergide (migraine prevention). Hofmann also isolated psilocybin and psilocin (1958).</li>
</ul>
<div class="callout analyst"><b>Analyst's corner</b> The indole is naturally <b>fluorescent</b> (nanogram sensitivity). The <b>van Urk reagent</b> (p-dimethylaminobenzaldehyde in acid) gives a blue colour as an identification test for the ergot family. Stability-indicating methods must <b>resolve the C-8 epimers</b> or they overstate active content; ergometrine injections are stored cold and protected from light. Forensic work uses LC-MS/MS at sub-nanogram per mL levels.</div>
<h3>The pharmacologist's lab</h3>
<ul>
 <li><b>Serotonin link:</b> serotonin was isolated from blood in 1948 (Erspamer found similar in gut); Twarog and Page found it in brain in 1953. <b>John Gaddum</b> (Edinburgh) and independently <b>Woolley and Shaw</b> found LSD <i>antagonised</i> serotonin on smooth muscle, implying serotonin has a role in mental function.</li>
 <li><b>Receptor:</b> the key target is the <b>5-HT<sub>2A</sub></b> receptor (GPCR, abundant on cortical pyramidal neurons), where LSD is a <b>partial agonist</b>. Ketanserin blocks its effects.</li>
 <li><b>Structures:</b> Roth, Dror and colleagues (2017) solved LSD bound to 5-HT<sub>2B</sub>; a receptor loop folds like a <b>lid</b> over the drug (2020: 5-HT<sub>2A</sub>), explaining slow dissociation and long action.</li>
 <li><b>Signalling:</b> G<sub>q</sub> → phospholipase C → IP<sub>3</sub> + DAG → Ca²⁺ release and PKC; a β-arrestin pathway is also engaged. Imaging shows reduced separation between normally independent brain networks; how this produces the experience is unsettled.</li>
 <li><b>Time course:</b> onset within an hour, peak 2–3 h, duration 8–12 h; <b>tolerance within days</b>; not physically addictive; low direct toxicity but serious psychological risks (panic, accidents, precipitation of psychosis, HPPD).</li>
</ul>
<h3>Legacy</h3>
<p>The most important legacy is an idea: a microgram-dose agent implied a receptor and helped identify serotonin as a brain neurotransmitter, leading to <b>SSRIs</b>, <b>atypical antipsychotics</b> (5-HT<sub>2A</sub> blockade) and <b>triptans</b>. Modern trials of psilocybin/LSD for depression, anxiety and addiction are small, hard to blind and preliminary. Hofmann's prepared mind: a chemist who knew ergot so well he could not ignore a coincidence, who recorded carefully, and who followed up with a controlled experiment.</p>`,
 key:[
  "LSD-25 (1938) was made as a possible circulatory stimulant and shelved; 1943 brought an unplanned exposure (16 Apr) and then a deliberate 250 µg self-experiment (19 Apr).",
  "Ergoline = rigid version of serotonin's tryptamine skeleton; C-8 diethylamide and correct stereochemistry are essential; iso-LSD is inactive.",
  "Gaddum and others showed LSD antagonises serotonin in the 1950s, supporting serotonin as a brain neurotransmitter.",
  "Main target 5-HT2A (Gq-coupled); a receptor 'lid' explains slow dissociation.",

 ],

},
{
 id:7, tag:"Chapter 6", title:"From Rocket Fuel to Mood Elevator: Iproniazid and the MAO Inhibitors", mins:30,
 sub:"A tuberculosis drug whose side effect launched antidepressant therapy and the monoamine hypothesis.",
 obj:[
  "Narrate how iproniazid's mood effect was noticed and tested",
  "Explain mechanism-based (suicide) inhibition of MAO and compare isoniazid with iproniazid",
  "Describe tyramine and serotonergic interactions with MAO inhibitors",
  "Evaluate the monoamine hypothesis as useful but incomplete"
 ],
 body:`
<h3>The serendipitous event</h3>
<ul>
 <li>TB treatment in 1950: sanatoria, streptomycin (1944; injected, ototoxic, resistance) and PAS (1946).</li>
 <li><b>Isoniazid</b> was first made in <b>Prague in 1912</b> and untested; in 1951–52 <b>Roche, Squibb and Bayer</b> independently found it potent against TB. At Roche, <b>Herbert Fox</b> made alkyl derivatives including <b>iproniazid</b> (isopropyl).</li>
 <li><b>1952, Sea View Hospital, Staten Island:</b> <b>Selikoff and Robitzek</b> treated advanced TB with both drugs. Patients on iproniazid became <b>cheerful, restless and energetic</b>; isoniazid did not produce the same mood change.</li>
 <li><b>1952:</b> <b>Zeller</b> showed iproniazid inhibits <b>monoamine oxidase (MAO)</b>. <b>1955:</b> Brodie's group showed it reversed reserpine sedation and raised brain serotonin.</li>
 <li><b>1957:</b> <b>Nathan Kline</b> reported use in depression ("psychic energizer"); marketed as an antidepressant in <b>1958</b>; withdrawn from most markets in <b>1961</b> for liver injury. Phenelzine and tranylcypromine took its place.</li>
</ul>
<div class="callout myth"><b>Myth and Record</b> "Iproniazid came from surplus V-2 rocket fuel" is a flourish: hydrazine was a wartime propellant and cheap afterwards, but isoniazid dates from 1912. The "dancing wards" were real publicity images, but a systematic mood effect was only shown by later study. Selikoff later became a leading asbestos investigator.</div>
<h3>The chemist's bench</h3>
<p>Isoniazid is a pyridine hydrazide; iproniazid adds an <b>isopropyl</b> on the terminal nitrogen. That small change is the whole difference between a purely antituberculosis drug and one that also inhibits MAO.</p>
<ul>
 <li><b>Isoniazid</b> is a prodrug activated by the bacterial catalase-peroxidase <b>KatG</b>; the product adds to NAD and blocks <b>InhA</b>, needed for mycolic acid synthesis.</li>
 <li><b>Iproniazid</b> is converted to isopropylhydrazine; when MAO tries to oxidise it, a reactive intermediate bonds covalently to the enzyme's <b>FAD</b>, permanently disabling it. This is <b>mechanism-based (suicide) inhibition</b>. Recovery requires new enzyme synthesis (≈2 weeks).</li>
 <li><b>Phenelzine</b> (2-phenylethylhydrazine) mimics the phenethylamine substrate; <b>tranylcypromine</b> uses a strained cyclopropylamine ring (trans arrangement required).</li>
</ul>
<table>
 <tr><th>Drug</th><th>Type</th><th>Notes</th></tr>
 <tr><td>Iproniazid</td><td>Irreversible hydrazine</td><td>First; withdrawn 1961 (liver injury)</td></tr>
 <tr><td>Phenelzine</td><td>Irreversible hydrazine</td><td>Non-selective; treatment-resistant depression</td></tr>
 <tr><td>Tranylcypromine</td><td>Irreversible cyclopropylamine</td><td>Non-selective; dietary tyramine precaution</td></tr>
 <tr><td>Moclobemide</td><td>Reversible, MAO-A selective</td><td>Fewer food interactions</td></tr>
 <tr><td>Selegiline / rasagiline</td><td>Irreversible, MAO-B selective (low dose)</td><td>Parkinson's disease; selegiline patch for depression</td></tr>
</table>
<ul>
 <li><b>Hepatotoxicity:</b> oxidation of hydrazines generates reactive species that bind proteins. Isoniazid itself can be hepatotoxic (older patients, alcohol), depletes <b>pyridoxine (B<sub>6</sub>)</b> and causes neuropathy, hence B<sub>6</sub> co-administration.</li>
 <li>Isoniazid is inactivated by <b>N-acetyltransferase</b>; slow acetylators have more adverse effects, one of the first examples of <b>pharmacogenetics</b>.</li>
</ul>
<div class="callout analyst"><b>Analyst's corner</b> Isoniazid is a reducing agent: assay by <b>potassium bromate</b> titration; HPLC for related substances. The hydrazine reacts with aldehydes/ketones to form <b>hydrazones</b>: incompatibility with reducing sugars such as lactose; in fixed-dose combinations it can react with rifampicin degradation products, reducing rifampicin availability (hence WHO emphasis on bioavailability testing). <b>Free hydrazine</b> is genotoxic and is measured after derivatisation because it has no chromophore.</div>
<h3>The pharmacologist's lab</h3>
<ul>
 <li><b>MAO</b> is a mitochondrial outer-membrane FAD enzyme that deaminates monoamines (serotonin, noradrenaline, dopamine, tyramine), producing an aldehyde, ammonia and H<sub>2</sub>O<sub>2</sub>. <b>MAO-A</b> prefers serotonin and noradrenaline (clorgyline-sensitive; gut, liver, nerve terminals). <b>MAO-B</b> prefers phenylethylamine (selegiline-sensitive; platelets, glia). Both handle dopamine.</li>
 <li>Blocking MAO stops destruction of transmitter leaking from vesicles; stores fill and each impulse releases more. Yet benefit takes <b>2–3 weeks</b>, so slower adaptations (receptor changes) must matter.</li>
 <li><b>Monoamine hypothesis</b> (Schildkraut, 1965): depression reflects relative catecholamine deficiency. It was productive (tricyclics, SSRIs) but is now seen as incomplete: delayed onset, no simple serotonin deficit found, and plasticity, glutamate and inflammation are implicated (ketamine acts differently).</li>
 <li><b>Cheese reaction</b> (Blackwell, 1963): with MAO blocked in gut/liver, dietary <b>tyramine</b> (aged cheese, cured meats, fermented soy, yeast extracts, some beers) reaches the circulation, displaces noradrenaline and causes hypertensive crisis.</li>
 <li><b>Other dangers:</b> serotonergic drugs (SSRIs, tramadol, pethidine, dextromethorphan) → <b>serotonin syndrome</b>; decongestants such as pseudoephedrine → hypertensive crisis. Allow ≈<b>2 weeks</b> after stopping an irreversible MAOI.</li>
</ul>
<h3>Legacy</h3>
<p>The 1950s gave psychiatry a pharmacy: chlorpromazine (1952), lithium (1949; accepted later), imipramine (1957) and iproniazid in depression (1957), none designed for its eventual purpose. This is <b>reverse pharmacology</b>: drug first, theory afterwards. Isoniazid remains a cornerstone of TB therapy with rifampicin, pyrazinamide and ethambutol; India carries roughly a quarter of the world's TB cases.</p>`,
 key:[
  "Iproniazid was developed for TB; 1952 patients became elated, and the drug was shown to inhibit MAO.",
  "The isopropyl group enables suicide inhibition: MAO oxidises the hydrazine and is permanently disabled. Isoniazid instead is activated by KatG and blocks InhA.",
  "MAO-A prefers serotonin/noradrenaline; MAO-B prefers phenylethylamine. Benefit takes weeks.",
  "Tyramine foods and serotonergic/sympathomimetic drugs are dangerous with MAOIs; hydrazines can be hepatotoxic (iproniazid withdrawn 1961).",
  "The monoamine hypothesis grew from these drugs and is useful but incomplete."
 ],

  {q:"“Suicide” (mechanism-based) inhibition means that…", o:["the enzyme converts the inhibitor into a reactive species that permanently disables the enzyme","the inhibitor is rapidly cleared before binding","the inhibitor is a competitive reversible binder","the drug kills the host cell"], w:"The enzyme mistakes the drug for a substrate and is destroyed in the attempt."},
  {q:"A patient on tranylcypromine eats aged cheese and has a hypertensive crisis. The culprit is…", o:["Tyramine entering the circulation and displacing noradrenaline","Histamine causing vasodilation","Excess vitamin K","Lactose reacting with the drug"], w:"Blocked gut/liver MAO fails to destroy dietary tyramine."},

  {q:"Why is the monoamine hypothesis considered incomplete?", o:["Clinical benefit is delayed by weeks even though enzyme inhibition is rapid","MAO inhibitors do not change neurotransmitter levels","Depression has no biochemical basis","SSRIs were never effective"], w:"Acute transmitter rises cannot be the whole story; plasticity and other systems are implicated."}
 ]

  "Draw the logic of aziridinium formation and DNA cross-linking",
  "Explain how nitrogen substituents tune reactivity (chlorambucil, melphalan, cyclophosphamide)",
  "Link therapeutic effect and toxicity to rapid cell division"
 ],
 body:`
<h3>The serendipitous event</h3>
<ul>
 <li><b>12 July 1917, Ypres:</b> sulfur mustard first used; delayed blistering of eyes, skin and lungs.</li>
 <li><b>1919:</b> <b>Edward and Helen Krumbhaar</b> reported very low white cells, emptied marrow and depleted lymphoid tissue in victims; the finding was forgotten.</li>
 <li><b>1942, Yale:</b> <b>Louis Goodman and Alfred Gilman</b> (authors of <i>The Pharmacological Basis of Therapeutics</i>, 1941), studying war gases for the OSRD, remembered the 1919 observation. Nitrogen mustard shrank transplanted mouse lymphoma; with surgeon <b>Gustaf Lindskog</b> they treated a man with lymphosarcoma in <b>August 1942</b>: tumours regressed for weeks, then returned. Classified; published in <b>1946</b>.</li>
 <li><b>2 December 1943, Bari:</b> a German raid hit the Liberty ship <i>John Harvey</i>, carrying secret mustard gas bombs. Oil mixed with mustard soaked survivors, who were treated for shock with clothes left on. <b>Lt Col Stewart Alexander</b> identified mustard and the blood and marrow damage, reinforcing the clinical case.</li>
</ul>
<div class="callout myth"><b>Myth and Record</b> <b>Bari did not start it.</b> The Yale work and first patient came in 1942, a year earlier. Bari added human data. Allied leaders also kept the mustard cargo secret for a time, leaving hospital staff uninformed.</div>
<h3>The chemist's bench</h3>
<p>Mustards are <b>bis(2-chloroethyl)</b> compounds: two arms, each with a chlorine on the second carbon. The central N lone pair displaces chloride from the far end of one arm, closing a three-membered, positively charged <b>aziridinium ion</b>, a strong electrophile. A nucleophile in DNA opens the ring; the second arm repeats the process, making a <b>bifunctional alkylating agent</b>.</p>
<ul>
 <li><b>Tuning reactivity:</b> in aliphatic HN2 (mechlorethamine) the lone pair is free, closure is fast, the drug hydrolyses in minutes and is injected fresh. In <b>chlorambucil</b> the N is attached to a benzene ring, the lone pair is partly drawn into the ring, closure slows, and it can be given <b>orally</b>. <b>Melphalan</b> (phenylalanine mustard) also uses an amino acid transporter.</li>
</ul>
<table>
 <tr><th>Drug</th><th>Design idea</th><th>Main uses</th></tr>
 <tr><td>Mechlorethamine (HN2)</td><td>Reactive aliphatic mustard, injected</td><td>Hodgkin lymphoma (MOPP); now rare</td></tr>
 <tr><td>Chlorambucil</td><td>Aromatic mustard, tempered reactivity, oral</td><td>Chronic lymphocytic leukaemia</td></tr>
 <tr><td>Melphalan</td><td>Mustard on phenylalanine; amino acid transporter</td><td>Multiple myeloma</td></tr>
 <tr><td>Cyclophosphamide</td><td>Inactive prodrug activated in liver</td><td>Lymphomas, breast cancer, lupus nephritis</td></tr>
 <tr><td>Bendamustine</td><td>Mustard + benzimidazole</td><td>Lymphoid cancers</td></tr>
</table>
<ul>
 <li><b>A wrong design that worked:</b> Brock designed <b>cyclophosphamide</b> (1950s) expecting tumours' high phosphamidase levels to unmask it. In fact it is activated mainly in the <b>liver by CYP450</b> to 4-hydroxycyclophosphamide, then phosphoramide mustard plus <b>acrolein</b> (bladder irritation, haemorrhagic cystitis), which <b>mesna</b> binds.</li>
 <li><b>SAR:</b> two arms for cross-linking; a <b>two-carbon</b> chain so a three-membered ring can form; chlorine as a balanced leaving group; the N-substituent sets reactivity.</li>
</ul>
<div class="callout analyst"><b>Analyst's corner</b> Mustards hydrolyse within minutes, so analysis must be fast and cold or via derivatisation (e.g., diethyldithiocarbamate). The <b>4-(4-nitrobenzyl)pyridine (NBP)</b> test is alkylated, then base gives a blue-violet colour. Cytotoxic, mutagenic, vesicant: closed systems, safety cabinets, cleaning validation. Reactive alkyl halide impurities in other drugs are potential mutagens, which helped drive guidelines on mutagenic impurities.</div>
<h3>The pharmacologist's lab</h3>
<ul>
 <li>The preferred nucleophile is <b>N7 of guanine</b> (in the major groove). The second arm reaches a guanine on the opposite strand, giving an <b>interstrand cross-link</b> that blocks strand separation, so replication and transcription stop; unrepaired damage triggers <b>apoptosis</b>.</li>
 <li>Fast-dividing tissues are hit hardest: marrow, lymphoid organs, gut lining, hair follicles. Therapeutic effect and toxicity are <b>two sides of one mechanism</b>.</li>
 <li>Adverse effects: marrow suppression (nadir 1–2 weeks), nausea/vomiting, alopecia, infertility, mucosal damage; HN2 is a <b>vesicant</b>; delayed second cancers such as AML.</li>
 <li>Resistance: better repair, ↑ glutathione, ↓ uptake, ↑ aldehyde dehydrogenase (cyclophosphamide), MGMT removing O6-alkyl groups for some alkylators.</li>
</ul>
<h3>Legacy</h3>
<p>A chemical given by mouth or vein can reach cancer cells anywhere, unlike surgery or radiation. <b>Sidney Farber's</b> aminopterin (1947) followed, then methotrexate, 6-MP and 5-FU, vinca alkaloids, and the <b>MOPP</b> regimen (<b>m</b>echlorethamine, <b>O</b>ncovin = vincristine, <b>p</b>rocarbazine, <b>p</b>rednisone; DeVita, NCI, 1960s), the first triumph of <b>combination chemotherapy</b>. Sulfur mustard is banned under the Chemical Weapons Convention while nitrogen mustards are used daily in clinics.</p>`,
 key:[
  "1919 observation → Yale 1942 first patient → published 1946. Bari (Dec 1943) confirmed blood effects but did not start the work.",
  "Chloroethyl arms close to aziridinium ions that alkylate DNA, chiefly guanine N7; two arms give interstrand cross-links.",
  "Aromatic mustards (chlorambucil, melphalan) are milder; cyclophosphamide is a liver-activated prodrug (mesna counters acrolein).",
  "Fast-dividing tissues suffer most; marrow suppression is dose-limiting; second cancers can follow.",
  "Mustards launched systemic chemotherapy and combination regimens such as MOPP."
 ],
 check:[
  {q:"Who treated the first patient with nitrogen mustard, and when?", o:["Goodman, Gilman and Lindskog at Yale, 1942","Alexander at Bari, 1943","Farber in Boston, 1947","DeVita at the NCI, 1960s"], w:"The Yale work (August 1942) predates the Bari disaster by over a year."},
  {q:"What is the reactive electrophile formed from a chloroethyl arm?", o:["A three-membered aziridinium ion","A β-lactam","A diazonium salt","An epoxide of vitamin K"], w:"Nitrogen's lone pair displaces chloride to form the strained, charged aziridinium ring."},
  {q:"Why can chlorambucil be given orally while mechlorethamine cannot?", o:["Its aryl-substituted nitrogen is less nucleophilic, so ring closure is slower and the drug is more stable","It lacks chloroethyl arms","It is not an alkylating agent","It is activated by the stomach"], w:"Electron withdrawal into the benzene ring tempers reactivity."},
  {q:"Mesna is given with cyclophosphamide to…", o:["bind acrolein and prevent haemorrhagic cystitis","activate the prodrug in the liver","prevent myelosuppression","increase DNA cross-linking"], w:"Acrolein is a bladder-irritating by-product of cyclophosphamide activation."},
  {q:"In the MOPP regimen, what does “O” stand for?", o:["Oncovin (vincristine)","Oxaliplatin","Omeprazole","Ondansetron"], w:"MOPP = mechlorethamine, Oncovin (vincristine), procarbazine, prednisone."}
 ]
